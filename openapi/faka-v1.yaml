      tags:
        - Creator Actions
      summary: Read the running tally of one of the caller's Votes
      description: |
        Added in 1.0.0-alpha.2. The creator who owns a Vote can read its tally at any time, including
        while voting is open. Participants cannot see it before voting closes (decision 21); a client
        must not show this count to the audience before then.

