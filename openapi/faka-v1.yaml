  /actions/{actionId}/cash-receipt:
    post:
      operationId: reportCashPayment
      tags:
        - Cash in Person
      summary: Choose to pay cash in person for an Action
      description: |
        The participant states that they are paying the creator in cash, in person. This creates a
        cash receipt in state `CASH_REPORTED_PENDING_CREATOR_CONFIRMATION` and moves the Action from
        `CREATED` to `INITIATED`. **Nothing is confirmed by this call.** The Action counts only when
        the creator confirms, from their own account, that they received the cash.

        Cash is paid directly to the creator. The platform does not collect it, hold it or settle
        it, and can never refund it. The platform fee and the processing fee on a cash receipt are
        always zero. `cashTermsAcknowledged` must be `true`: it records that the participant was told
        that cash is paid directly to the creator and that the platform does not collect it.

        Cash is available only where `listActionPaymentMethods` returns `CASH_IN_PERSON`. It is never
        available for a Bid, for a free Action, or on a profile that is not self-managed; in those
        cases the response is `409` with `CASH_NOT_AVAILABLE`.

        A participant must not be charged twice. If an online payment for the Action is open, the
        server expires it first when it safely can; if that payment's outcome is not yet known, the
        response is `409` with `PAYMENT_ALREADY_IN_PROGRESS`.

        `Idempotency-Key` is required. An Action has at most one cash receipt; a retry returns it.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCashPaymentRequest'
            examples:
              cash:
                value:
                  cashTermsAcknowledged: true
      responses:
        '201':
          description: Cash reported, waiting for the creator to confirm. Replaying the request
            with the same `Idempotency-Key` returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              description: '`/api/v1/actions/{actionId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashReceipt'
              examples:
                reported:
                  value:
                    id: 01JAB5C7D9E1F3G5H7J9K1M3N5
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    actionType: REQUEST
                    creatorActionTitle: Request a song
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    state: CASH_REPORTED_PENDING_CREATOR_CONFIRMATION
                    platformFee:
                      amountMinor: 0
                      currency: ZAR
                    processingFee:
                      amountMinor: 0
                      currency: ZAR
                    reportedAt: '2026-10-12T20:00:40Z'
                    confirmedAt: null
                    note: null
                    voidedAt: null
                    correctsCashReceiptId: null
                    correctionReason: null
        '400':
          $ref: '#/components/responses/BadRequestOrMissingIdempotencyKey'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such Action for this caller (`ACTION_NOT_FOUND`). An Action that belongs
            to someone else is not distinguished from one that does not exist.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                actionNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: ACTION_NOT_FOUND
                    detail: This could not be found.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
