  /actions/{actionId}:
    get:
      operationId: getAction
      tags:
        - My Activity
      summary: Get the status of one of the caller's Actions
      description: |
        Returns the caller's Action with everything a participant needs to follow it: the Action
        state, the state of each payment, the fulfilment deadline and the refund status.

        A member reads their own Actions with a bearer token. A guest reads theirs with the
        `X-Guest-Token` of the guest session that made the Action.

        The three states are separate and none implies another:

        - `state` is the Action state. An Action is never "refunded" or "disputed".
        - `payments[].state` is the payment state. A refund shows as payment state `REFUNDED`, with
          progress in `payments[].refund`. While a refund is in progress the payment is still
          `CONFIRMED` and `refund.status` shows how far it has got.
        - `cashReceipt.state` is the cash state, when cash in person was chosen.

        A confirmed payment does not mean the Action was fulfilled, and a fulfilled Action does not
        mean the creator has been paid out.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The Action.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
