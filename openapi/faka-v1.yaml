                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PaymentProviderUnavailable'
  /payments/{paymentId}:
    get:
      operationId: getPayment
      tags:
        - Payments
      summary: Get the status of a payment
      description: |
        Returns the canonical state of one of the caller's payments. **This is the only source of
        truth a client may use for whether a payment succeeded.**

        States: `CREATED` (recorded, nothing sent to the payer's bank), `PENDING` (handed to the
        provider, outcome not known), `CONFIRMED` (the server has verified with the provider that the
        money was collected), `FAILED`, `EXPIRED` (the checkout window closed unpaid), `REFUNDED` (the
        full amount was returned), `DISPUTED` (a dispute or chargeback is open) and `REVERSED` (the
        provider took the money back).

        While the state is `PENDING` the outcome is unknown, not failed: the client polls with a
        modest interval and does not start another payment. `CONFIRMED` is not final: a refund,
        dispute or reversal can follow, and the platform never promises that a refund becomes
        impossible after a period. Rarely, a payment shown as `FAILED` or `EXPIRED` later becomes
        `CONFIRMED` because the provider's confirmation arrived late; if its Action is already closed
        it is then refunded in full automatically.

        Refunds are automatic and always for the full amount. There is no operation to request one.
        `refund` shows the refund's status when one exists.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The payment.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                pending:
                  summary: Handed to the provider, outcome not known
                  value:
                    id: 01JAB4P6Q8R0S2T4V6W8X0Y2Z4
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    purpose: INITIAL
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    method: CARD
                    state: PENDING
                    checkout:
                      type: REDIRECT
                      url: https://checkout.example.com/session/abc123
                    expiresAt: '2026-10-12T20:30:00Z'
                    confirmedAt: null
                    failureCode: null
                    refund: null
                    createdAt: '2026-10-12T20:00:30Z'
                    updatedAt: '2026-10-12T20:00:31Z'
                confirmed:
                  summary: Confirmed
                  value:
                    id: 01JAB4P6Q8R0S2T4V6W8X0Y2Z4
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    purpose: INITIAL
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    method: CARD
                    state: CONFIRMED
                    checkout: null
                    expiresAt: '2026-10-12T20:30:00Z'
                    confirmedAt: '2026-10-12T20:01:00Z'
                    failureCode: null
                    refund: null
                    createdAt: '2026-10-12T20:00:30Z'
                    updatedAt: '2026-10-12T20:01:00Z'
                refunded:
