              examples:
                closed:
                  value:
                    items:
                      - optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        votes: 42
                      - optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q7
                        label: Mnike
                        votes: 37
                    page:
                      limit: 20
                      hasMore: false
