  /creator-actions/{creatorActionId}/votes:
    post:
      operationId: submitVote
      tags:
        - Participation
      summary: Submit a Vote
      description: |
        The audience chooses among creator-defined options. Votes are free in MVP1, so a Vote has no
        payment and is returned in state `SUBMITTED`, already counted.

        The caller is a signed-in member (bearer token) or a guest (`X-Guest-Token`, from
        `createGuestSession`). A guest may take part only where the Creator Action allows guests;
        otherwise the response is `403` with `GUEST_NOT_ALLOWED`. Taking part never creates a member
        account.

        `Idempotency-Key` is required. A retry with the same key and the same body returns the first
        result and never creates a second Action or a second payment.

        `configVersion` is the version the participant was shown (from `getPublicCreatorAction`). If
        the creator has changed the configuration since, the response is `409` with
        `ACTION_CONFIG_CHANGED`; the client reloads the Creator Action, shows the new terms and
        submits again with a new key.

        **A vote cannot be changed once submitted.** There is no operation to switch it to another
        option or to withdraw it, and `cancelAction` refuses a Vote. The client should make this clear
        before the participant confirms.

        When the participant has used up the votes the Creator Action allows, the response is `409`
        with `PARTICIPATION_LIMIT_REACHED` and no vote is counted.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - name: creatorActionId
          in: path
          required: true
          description: The `id` of a public Creator Action.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JAB2C4D6E8F0G2H4J6K8M0N2
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitVoteRequest'
            examples:
              vote:
                value:
                  configVersion: 1
                  optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
      responses:
        '201':
          description: Vote counted. Replaying the request with the same `Idempotency-Key` returns
            this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: '`/api/v1/actions/{actionId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
              examples:
                counted:
                  value:
                    action:
                      id: 01JAB3A5B7C9D1E3F5G7H9J1K3
                      type: VOTE
                      state: SUBMITTED
                      creatorAction:
                        id: 01JAB2E6F8G0H2J4K6M8N0P2Q4
                        type: VOTE
                        slug: next-song
                        title: Vote for the next song
                        creatorHandle: djthandi
                        creatorDisplayName: DJ Thandi
                      configVersion: 1
                      paymentRequirement: FREE
                      amount: null
                      paymentMethod: FREE
                      selection:
                        optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        secondaryLabel: Tyla
                      note: null
                      message: null
