                          currency: ZAR
                        processing:
                          amountMinor: 1940
                          currency: ZAR
                        paidOut:
                          amountMinor: 1940
                          currency: ZAR
                        owed:
                          amountMinor: 0
                          currency: ZAR
                    cash: []
