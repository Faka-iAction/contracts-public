  /creator-actions/{creatorActionId}/bids:
    post:
      operationId: submitBid
      tags:
        - Participation
      summary: Place a Bid
      description: |
        A participant pays for a place in the priority order. Every bidder pays when bidding; a bid
        does not count, and is not ranked, until its payment is confirmed.

        The caller is a signed-in member (bearer token) or a guest (`X-Guest-Token`, from
        `createGuestSession`). A guest may take part only where the Creator Action allows guests;
        otherwise the response is `403` with `GUEST_NOT_ALLOWED`. Taking part never creates a member
        account.

        `Idempotency-Key` is required. A retry with the same key and the same body returns the first
        result and never creates a second Action or a second payment.

        `configVersion` is the version the participant was shown (from `getPublicCreatorAction`). If
        the creator has changed the configuration since, the response is `409` with
        `ACTION_CONFIG_CHANGED`; the client reloads the Creator Action, shows the new terms and
        submits again with a new key.

        `amount` is chosen by the participant and validated by the server: it must be at least the
        minimum bid and equal to the minimum plus a whole number of increments, in the Creator
        Action's currency. **It does not have to beat the highest bid**: any valid amount joins the
        ranking at the place it earns. An invalid amount is rejected with `422` and field code
        `BELOW_MINIMUM`, `NOT_IN_INCREMENT` or `CURRENCY_MISMATCH`.

        `bidTermsAcknowledged` must be `true`. It records that the participant was shown, before
        paying, that they are charged now, that being outbid lowers their position.

        The Action is returned in state `CREATED` with `bid.rank` `null`. The client then calls
        `createPayment`. **A Bid cannot be paid in cash**: `paymentMethods` never contains
        `CASH_IN_PERSON` for a Bid, and `reportCashPayment` refuses one.

        A bid is refunded in full, automatically, if the creator
        rejects it, the Creator Action is disabled, or it is still unfulfilled at its fulfilment
        deadline, whatever its rank.

        A submission that needs a payment is refused with `503` and `PAYMENT_PROVIDER_UNAVAILABLE`
        while no payment provider is configured on the server or the provider cannot be reached.
        Nothing is stored and nothing is charged; the client may retry with the same
        `Idempotency-Key`. A free submission never depends on the provider.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - name: creatorActionId
          in: path
          required: true
          description: The `id` of a public Creator Action.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JAB2C4D6E8F0G2H4J6K8M0N2
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBidRequest'
            examples:
              bid:
                value:
                  configVersion: 1
                  amount:
                    amountMinor: 3000
                    currency: ZAR
                  customFieldValue: Mnike
                  bidTermsAcknowledged: true
      responses:
        '201':
          description: Bid stored, waiting for payment. Replaying the request with the same `Idempotency-Key`
            returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: '`/api/v1/actions/{actionId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
              examples:
                placed:
                  value:
                    action:
                      id: 01JAB3A5B7C9D1E3F5G7H9J1K3
                      type: BID
                      state: CREATED
                      creatorAction:
                        id: 01JAB2D5E7F9G1H3J5K7M9N1P3
                        type: BID
                        slug: jump-the-queue
                        title: Jump the queue
                        creatorHandle: djthandi
                        creatorDisplayName: DJ Thandi
                      configVersion: 1
                      paymentRequirement: PAID
                      amount:
                        amountMinor: 3000
                        currency: ZAR
                      paymentMethod: null
                      selection: null
                      note: null
                      message: null
                      customFieldValue: Mnike
                      bid:
                        total:
                          amountMinor: 0
                          currency: ZAR
                        rank: null
                        rankedBidCount: 3
                        raiseCount: 0
                      payments: []
                      cashReceipt: null
                      fulfilmentDeadlineAt: null
                      canCancel: true
                      canRaise: false
                      closeReason: null
                      createdAt: '2026-10-12T20:00:00Z'
                      submittedAt: null
                      acceptedAt: null
                      fulfilledAt: null
                      closedAt: null
                      updatedAt: '2026-10-12T20:00:00Z'
                    paymentRequired: true
                    paymentMethods:
                      - code: CARD
                        kind: ONLINE
                        displayName: Card
        '400':
          $ref: '#/components/responses/BadRequestOrMissingIdempotencyKey'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '403':
          description: Guests cannot take part in this Creator Action (`GUEST_NOT_ALLOWED`), or
            a platform control declined the participation (`PARTICIPATION_DECLINED`, `TRANSACTION_LIMIT_EXCEEDED`).
            No reason is given for a declined participation.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                guestNotAllowed:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: GUEST_NOT_ALLOWED
                    detail: Sign in to take part in this Action.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                participationDeclined:
                  value:
                    type: about:blank
