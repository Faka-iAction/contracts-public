  /actions/{actionId}/bid-position:
    get:
      operationId: getBidPosition
      tags:
        - Participation
      summary: Get the current position of a Bid
      description: |
        Returns the caller's bid total and its current rank among the ranked bids on the same Creator
        Action. Rank 1 is first. `rank` is `null` before the first payment is confirmed and after the
        bid has left the ranking (fulfilled, rejected, cancelled or expired).

        Rank is information, not a promise: the creator is not forced to fulfil bids in rank order.
        Ranks change as other bids are confirmed, raised or leave the ranking, so a client refreshes
        this rather than caching it.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The bid's position.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
