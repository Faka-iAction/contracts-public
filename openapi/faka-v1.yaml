        '403':
          description: Guests cannot take part in this Creator Action (`GUEST_NOT_ALLOWED`), or
            a platform control declined the participation (`PARTICIPATION_DECLINED`, `TRANSACTION_LIMIT_EXCEEDED`).
            No reason is given for a declined participation.
          headers:
