      summary: Mark an incoming Action fulfilled
      description: |
        The creator attests that an `ACCEPTED` Action has been done: the song played, the message
        read, the request delivered. It moves to `FULFILLED`. This is the creator's attestation; the
        participant can still dispute it through their payment provider.

        Fulfilling is possible only before the fulfilment deadline. After the deadline the Action is
        `EXPIRED` and any confirmed online payment is refunded automatically.

        Fulfilment does not pay the creator. It is one of the conditions for the payment to become
        eligible for settlement; the others are the cool-off and a verified Settlement Profile.

        Bids may be fulfilled in any order. A fulfilled bid leaves the ranking and the bids below it
        move up. A Vote and a Tip have no fulfilment step.

        Repeating the call on a `FULFILLED` Action returns `200` and changes nothing.
