                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: The Creator Action is not open (`CREATOR_ACTION_NOT_OPEN`), its configuration
            changed (`ACTION_CONFIG_CHANGED`), a participation limit is reached (`PARTICIPATION_LIMIT_REACHED`),
            or the idempotency key was misused.
          headers:
