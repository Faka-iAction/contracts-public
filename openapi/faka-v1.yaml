  /creator-actions/{creatorActionId}/options:
    get:
      operationId: listPublicActionOptions
      tags:
        - Public Actions
      summary: List the choices of a public Creator Action
      description: |
        Returns the choices a participant can pick from on a Request or Vote, in display order. The
        choices come from the Creator Action's own options or from the playlist it is limited to; the
        client does not need to know which, and sends the chosen `id` as `optionId` when submitting.

        Choices that are not available are included with `available: false` so that a client can
        show them as unavailable. `q` filters by text, which a long playlist needs.
      security: []
      parameters:
        - name: creatorActionId
          in: path
          required: true
          description: The `id` of a public Creator Action.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JAB2C4D6E8F0G2H4J6K8M0N2
        - name: q
          in: query
          description: Free-text filter over the label and secondary label.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: water
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of choices.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActionOptionPage'
              examples:
                onePage:
                  value:
                    items:
                      - id: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        secondaryLabel: Tyla
                        available: true
                    page:
                      limit: 20
                      hasMore: false
                      nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No public Creator Action matches (`CREATOR_ACTION_NOT_FOUND`).
          headers:
