  /me/cash-receipts/{cashReceiptId}/confirm:
    post:
      operationId: confirmCashReceipt
      tags:
        - Cash in Person
      summary: Confirm that cash was received
      description: |
        The creator attests that they received the cash. The receipt moves to
        `CASH_CONFIRMED_BY_CREATOR`, and the Action moves to `SUBMITTED` (a Tip moves to `COMPLETED`).

        **Only the authenticated creator who owns the profile can confirm.** A manager, staff member,
        representative, administrator or the customer cannot. A QR scan, the customer's statement or
        the Action having been submitted is not confirmation.

        `amount` must equal the amount on the receipt, in the same currency; a different amount is
        rejected with `422` and field code `AMOUNT_MISMATCH` or `CURRENCY_MISMATCH`. Sending it makes
        the creator state the amount they are attesting to.

        Confirmation records the creator's attestation and nothing more. It does not mark the Action
        fulfilled, and it creates no payment, settlement, payout, pending balance or referral reward.
        The platform fee is zero and no fee is taken from any other payment to make up for it.

        `Idempotency-Key` is required, and the operation is also idempotent by state: confirming a
        receipt that is already confirmed returns `200` with the confirmed receipt and creates no
        second record. A voided receipt cannot be confirmed (`CASH_RECEIPT_STATE_CONFLICT`).
      parameters:
        - $ref: '#/components/parameters/CashReceiptId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCashReceiptRequest'
            examples:
              confirm:
                value:
                  amount:
                    amountMinor: 2000
                    currency: ZAR
                  note: Paid at the booth
      responses:
        '200':
          description: The confirmed cash receipt. Replaying the request with the same `Idempotency-Key`
            returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
