openapi: 3.1.0
info:
  title: FAKA iAction Platform API
  version: 1.0.0-alpha.5
  summary: Contract for the FAKA iAction platform API (MVP1 draft).
  description: |
    Contract-first HTTP API for the FAKA iAction platform. FAKA iAction is the
    platform; FAKA iRequest is one vertical on it.

    This file is the M1 contract draft. It fixes the cross-cutting conventions
    and covers identity, profiles, discovery, follows, QR resolution, Creator
    Actions, participation (as a member or a guest), vote tallies, online
    payments, cash in person, the creator's queue, the creator's read-only
    money views, the Settlement Profile and payouts, for the five MVP1 Action
    types.

    Referrals, live sessions, notifications, reporting, QR management and
    provider notifications (webhooks) are deliberately absent. Administration
    (admin roles, moderation decisions, the audit log, the outbox and country
    configuration) is web-only by design and is not part of this API.

    The money operations are provider-neutral. Paystack is the MVP1 payment
    provider (product decision 25). Creators are paid out to their verified
    payout destination; live payouts are switched off. See `CONVENTIONS.md`,
    "Dependence on the payment provider".

    1.0.0-alpha.2 records what the Symfony reference implementation does where
    alpha.1 was silent, applies product decisions 17 to 25, and adds the two
    vote tally operations. 1.0.0-alpha.3 applies product decisions 26 and 27 to
    the settlement, payout and money sections only. See `CONVENTIONS.md` for
    the list of changes.

    The conventions are described in prose in `CONVENTIONS.md` next to this
    file. Where this file and `CONVENTIONS.md` disagree, this file wins for
    shapes and `CONVENTIONS.md` wins for behaviour that OpenAPI cannot express.

    Status: draft for review. This file makes no claim about what is implemented
    or tested.
  license:
    name: Proprietary. All rights reserved.
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: >-
      Base path, relative to the API host of the environment in use. Host names
      are environment configuration and are not part of this contract.
tags:
  - name: Identity
    description: >-
      Registration, sign-in (one-time code, password, social login) and token
      lifecycle.
  - name: Members
    description: The signed-in member's own account, sign-in identifiers and capabilities.
  - name: Creator Profile
    description: The signed-in member's own creator profile.
  - name: Discovery
    description: Public creator profiles and creator search. No authentication required.
  - name: Following
    description: Creators the signed-in member follows.
  - name: QR
    description: Resolution of short opaque QR identifiers. No authentication required.
  - name: Creator Actions
    description: 'A creator''s own Creator Actions: the definitions a creator publishes (Request,
      Vote, Bid, Shout-out, Tip).'
  - name: Action Options and Playlists
    description: The choices a creator offers on a Request or Vote.
  - name: Public Actions
    description: Public Creator Actions and their choices. No authentication required.
  - name: Participation
    description: Taking part in a Creator Action, as a member or as a guest.
  - name: My Activity
    description: A participant's own Actions and their status.
  - name: Payments
    description: Online payments for participant Actions. Provider-neutral.
  - name: Cash in Person
    description: Cash paid in person, directly to a self-managed creator. Never for a Bid.
  - name: Creator Queue
    description: The participant Actions a creator has received, and their fulfilment.
  - name: Creator Money
    description: Read-only views of what has been collected for a creator and paid out to them.
      There is no wallet.
  - name: Settlement Profile
    description: A member's payout eligibility and payout details.
  - name: Trust and Safety
    description: Reports about public creators and Creator Actions.
security:
  - bearerAuth: []

paths:
  /members:
    post:
      operationId: registerMember
      tags: [Identity]
      summary: Start registering a new member (sends a one-time code)
      description: |
        Starts an explicit registration with an email address or a phone
        number. The server sends a one-time code to the identifier and returns
        a verification challenge. No member exists yet; the member is created
        when the code is presented to `signIn`, which also issues tokens.

        **The response is the same whether or not the identifier is already
        registered.** The status, the body shape and the response time must
        not let a caller tell the two cases apart. If the identifier already
        belongs to a member, no second member is created: the code that is
        sent signs the owner in to the existing member instead, and the
        profile data in this request is discarded. Only someone who controls
        the identifier ever learns which case applied.

        Calling the operation again for the same identifier sends a new code
        and returns a new challenge; the earlier challenge stops working. For
        that reason `Idempotency-Key` is not accepted here. The operation is
        rate limited per identifier and per caller.

        `password` is optional and is accepted only with an email identifier:
        email sign-in offers both a password and a one-time code, and phone
        sign-in uses a one-time code only.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
            examples:
              withEmail:
                summary: Register with an email address
                value:
                  identifier:
                    type: email
                    value: thandi@example.com
                  displayName: Thandi M
                  country: ZA
                  locale: en-ZA
              withEmailAndPassword:
                summary: Register with an email address and set a password
                value:
                  identifier:
                    type: email
                    value: thandi@example.com
                  displayName: Thandi M
                  password: correct-horse-battery-staple
              withPhone:
                summary: Register with a phone number
                value:
                  identifier:
                    type: phone
                    value: '+27821234567'
                  displayName: Thandi M
      responses:
        '202':
          description: >-
            Accepted. A code has been sent if the request was valid. Identical
            for a new and for an already registered identifier.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallenge'
              examples:
                challenge:
                  $ref: '#/components/examples/VerificationChallengeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/verifications:
    post:
      operationId: startSignIn
      tags: [Identity]
      summary: Start signing in with an email address or phone number (sends a one-time code)
      description: |
        Asks for a one-time sign-in code to be sent to an email address or a
        phone number, and returns a verification challenge. The code is then
        presented to `signIn`.

        **The response is the same whether or not the identifier belongs to a
        member.** The status, the body shape and the response time must not
        let a caller tell the two cases apart. When the identifier is not
        registered, a challenge is still returned; it can never be completed.
        This operation never creates a member: registration is explicit and
        goes through `registerMember`.

        Calling the operation again for the same identifier sends a new code
        and invalidates the earlier challenge. The operation is rate limited
        per identifier and per caller.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSignInRequest'
            examples:
              withEmail:
                summary: Code to an email address
                value:
                  identifier:
                    type: email
                    value: thandi@example.com
              withPhone:
                summary: Code to a phone number
                value:
                  identifier:
                    type: phone
                    value: '+27821234567'
      responses:
        '202':
          description: >-
            Accepted. Identical for a registered and for an unregistered
            identifier.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallenge'
              examples:
                challenge:
                  $ref: '#/components/examples/VerificationChallengeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/tokens:
    post:
      operationId: signIn
      tags: [Identity]
      summary: Sign in and issue an access token and a refresh token
      description: |
        Exchanges a proof of identity for a short-lived access token and a
        refresh token. `grantType` selects the proof:

        - `verification_code`: the `verificationId` of a challenge from
          `registerMember` or `startSignIn`, and the one-time code that was
          sent. Completing a registration challenge creates the member
          (`memberCreated: true`) unless the identifier already belonged to a
          member, in which case that member is signed in.
        - `password`: an email identifier and a password. Email sign-in offers
          both this and the one-time code. A phone identifier is not accepted
          with this grant: the request is rejected with `422`, field
          `identifier.type`, code `NOT_ALLOWED`. A member who has no password
          (for example, one who only uses social sign-in) cannot use it.

        Every failure to authenticate returns the same `401` with code
        `INVALID_CREDENTIALS`: unknown identifier, wrong password, no
        password set, wrong code, expired or already used code, unknown
        `verificationId`, too many attempts, or an account that cannot sign
        in. The response must not reveal which. A challenge allows a limited
        number of attempts and is then dead. This operation is rate limited.

        These tokens are for API clients. They are not web sessions and cannot
        be exchanged for one.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              withCode:
                summary: Complete a registration or sign-in challenge with the one-time code
                value:
                  grantType: verification_code
                  verificationId: 01JA8QV7C2D4E6F8G0H1J3K5M7
                  code: '482913'
              withPassword:
                summary: Email and password
                value:
                  grantType: password
                  identifier:
                    type: email
                    value: thandi@example.com
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: Signed in.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
              examples:
                signedIn:
                  $ref: '#/components/examples/SignInResultExample'
                registered:
                  $ref: '#/components/examples/SignInResultNewMemberExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/tokens/social:
    post:
      operationId: signInWithSocial
      tags: [Identity]
      summary: Sign in with a social login provider
      description: |
        Exchanges a credential issued by a social login provider for FAKA
        tokens. The server validates the credential with the provider; the
        client's claim about who the user is is never trusted.

        - If the provider identity is already attached to a member, that
          member is signed in.
        - If it is not, a member is created on this first use
          (`memberCreated: true`). The user chose to continue with the
          provider, so this is an explicit registration. A member created
          this way has no password.

        Whether a provider identity may instead be attached to an existing
        member whose verified email matches the provider-verified email is a
        proposal that is not yet decided. An email that the provider has not
        verified never attaches automatically.

        The providers are Google and Apple.

        If the provider supplies no name and the request carries no
        `displayName`, sign-in still succeeds: the member is created with
        `displayName` `null`, and the client asks for a name afterwards and
        sets it with `updateOwnMember`.

        A credential that is invalid, expired, issued for another client, or
        replayed returns `401` with `INVALID_CREDENTIALS`. A provider that is
        not configured on the server, or that cannot be reached, returns `503`
        with `SOCIAL_PROVIDER_UNAVAILABLE`.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialSignInRequest'
            examples:
              googleIdToken:
                summary: Google ID token
                value:
                  provider: google
                  credential:
                    type: id_token
                    value: example.provider-issued.id-token
                  nonce: n-0S6_WzA2Mj
              appleAuthorizationCode:
                summary: Apple authorization code, with profile data for first use
                value:
                  provider: apple
                  credential:
                    type: authorization_code
                    value: example-provider-authorization-code
                  displayName: Thandi M
                  country: ZA
      responses:
        '200':
          description: Signed in. `memberCreated` says whether this call created the member.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
              examples:
                signedIn:
                  $ref: '#/components/examples/SignInResultExample'
                firstUse:
                  $ref: '#/components/examples/SignInResultNewMemberExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SocialProviderUnavailable'

  /auth/tokens/refresh:
    post:
      operationId: refreshToken
      tags: [Identity]
      summary: Exchange a refresh token for a new token pair (rotation)
      description: |
        Returns a new access token and a new refresh token. The presented
        refresh token is consumed and cannot be used again.

        A refresh token that is unknown, expired, revoked or already used
        returns `401` with code `REFRESH_TOKEN_INVALID`; the client must sign in
        again. The response does not say which of these applied.

        The refresh token is the credential for this operation. No access token
        is sent.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              refresh:
                value:
                  refreshToken: rt_example_8f2c1e7a9b3d4c5f6a7b8c9d0e1f2a3b
      responses:
        '200':
          description: New token pair issued. The previous refresh token is no longer valid.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                rotated:
                  $ref: '#/components/examples/TokenPairExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The refresh token cannot be used. Always `REFRESH_TOKEN_INVALID`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                refreshTokenInvalid:
                  value:
                    type: about:blank
                    title: Unauthorized
                    status: 401
                    code: REFRESH_TOKEN_INVALID
                    detail: Sign in again to continue.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [Identity]
      summary: Sign out of the current API session
      description: |
        Revokes the API session that the presented access token belongs to,
        including its refresh token. Other sessions of the same member are not
        affected.

        The request has no body. Repeating the call with an access token whose
        session is already revoked returns `401`, which a client should treat
        as signed out.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Signed out. No content.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-examples-note: >-
        This operation has no request or response body. Example exchange:
        `POST /api/v1/auth/sign-out` with `Authorization: Bearer <access token>`
        returns `204 No Content`.

  /me:
    get:
      operationId: getOwnMember
      tags: [Members]
      summary: Get the signed-in member's own profile
      description: Returns the private member record of the caller. It is never returned for another member.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The caller's member record.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                member:
                  $ref: '#/components/examples/MemberExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateOwnMember
      tags: [Members]
      summary: Update the signed-in member's own profile
      description: |
        Partial update. Fields that are absent are left unchanged. A field sent
        as `null` is cleared where the schema allows `null`.

        Sign-in identifiers are not changed here; they are managed with the
        `/me/identifiers` operations. Setting or changing a password is out of
        scope of this skeleton.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
            examples:
              changeDisplayName:
                value:
                  displayName: Thandi Mokoena
              changeLocale:
                value:
                  locale: zu-ZA
      responses:
        '200':
          description: The updated member record.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                updated:
                  $ref: '#/components/examples/MemberExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/identifiers:
    get:
      operationId: listOwnIdentifiers
      tags: [Members]
      summary: List the signed-in member's sign-in identifiers
      description: >-
        Returns the email addresses, phone numbers and social login identities
        the caller can sign in with, oldest first. Only verified identifiers
        appear; an identifier that is still waiting for its code is not
        listed.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of the caller's sign-in identifiers.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberIdentifierPage'
              examples:
                emailAndGoogle:
                  value:
                    items:
                      - id: 01JA8QW1A3B5C7D9E1F3G5H7J9
                        type: email
                        provider: null
                        value: thandi@example.com
                        verifiedAt: '2026-10-12T08:00:00Z'
                        createdAt: '2026-10-12T08:00:00Z'
                      - id: 01JA8QW9K2M4N6P8Q0R2S4T6V8
                        type: social
                        provider: google
                        value: thandi@example.com
                        verifiedAt: '2026-10-12T08:30:00Z'
                        createdAt: '2026-10-12T08:30:00Z'
                    page:
                      limit: 20
                      hasMore: false
                      nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: addOwnIdentifier
      tags: [Members]
      summary: Add a sign-in identifier to the signed-in member (with verification)
      description: |
        Adds another way for the caller to sign in.

        - **Email or phone:** the server sends a one-time code to the
          identifier and returns `202` with a verification challenge. The
          identifier is not attached, and cannot be used to sign in, until the
          code is presented to `confirmOwnIdentifier`. The `202` is the same
          whether or not the identifier already belongs to another member, so
          this operation cannot be used to find out who is registered.
        - **Social:** the provider credential is itself the proof of control.
          The server validates it with the provider and returns `201` with the
          attached identifier.

        Adding an identifier the caller already has is not an error: for email
        or phone a challenge is returned as usual, and for social the existing
        identifier is returned.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIdentifierRequest'
            examples:
              addPhone:
                summary: Add a phone number
                value:
                  type: phone
                  value: '+27821234567'
              addGoogle:
                summary: Link a Google identity
                value:
                  type: social
                  provider: google
                  credential:
                    type: id_token
                    value: example.provider-issued.id-token
      responses:
        '201':
          description: Social identity attached.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberIdentifier'
              examples:
                googleAttached:
                  value:
                    id: 01JA8QW9K2M4N6P8Q0R2S4T6V8
                    type: social
                    provider: google
                    value: thandi@example.com
                    verifiedAt: '2026-10-12T08:30:00Z'
                    createdAt: '2026-10-12T08:30:00Z'
        '202':
          description: >-
            Email or phone: a code has been sent. Identical whether or not the
            identifier belongs to another member.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallenge'
              examples:
                challenge:
                  $ref: '#/components/examples/VerificationChallengeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Social only: the provider identity is attached to another member
            (`IDENTIFIER_NOT_AVAILABLE`). The caller has proved control of the
            provider account, so this does not disclose anything to a
            stranger.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                identifierNotAvailable:
                  $ref: '#/components/examples/ProblemIdentifierNotAvailable'
        '422':
          description: >-
            A field is invalid (`VALIDATION_FAILED`), or the provider
            credential could not be verified (`VERIFICATION_FAILED`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                verificationFailed:
                  $ref: '#/components/examples/ProblemVerificationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SocialProviderUnavailable'

  /me/identifier-verifications:
    post:
      operationId: confirmOwnIdentifier
      tags: [Members]
      summary: Confirm a new email or phone identifier with its one-time code
      description: |
        Completes `addOwnIdentifier` for an email address or phone number. On
        success the identifier is attached to the caller and can be used to
        sign in.

        A wrong, expired or already used code, an unknown `verificationId`, a
        challenge that belongs to another member, and too many attempts all
        return `422` with `VERIFICATION_FAILED`, without saying which.

        If the code is correct but the identifier belongs to another member,
        the response is `409` with `IDENTIFIER_NOT_AVAILABLE`. Only a caller
        who has proved control of the identifier can reach this result.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIdentifierRequest'
            examples:
              confirm:
                value:
                  verificationId: 01JA8QV7C2D4E6F8G0H1J3K5M7
                  code: '482913'
      responses:
        '201':
          description: Identifier attached.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberIdentifier'
              examples:
                phoneAttached:
                  value:
                    id: 01JA8QX3B5C7D9E1F3G5H7J9K1
                    type: phone
                    provider: null
                    value: '+27821234567'
                    verifiedAt: '2026-10-12T09:00:00Z'
                    createdAt: '2026-10-12T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The identifier belongs to another member (`IDENTIFIER_NOT_AVAILABLE`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                identifierNotAvailable:
                  $ref: '#/components/examples/ProblemIdentifierNotAvailable'
        '422':
          description: >-
            A field is invalid (`VALIDATION_FAILED`), or the code could not be
            verified (`VERIFICATION_FAILED`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                verificationFailed:
                  $ref: '#/components/examples/ProblemVerificationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/identifiers/{identifierId}:
    delete:
      operationId: removeOwnIdentifier
      tags: [Members]
      summary: Remove one of the signed-in member's sign-in identifiers
      description: |
        Detaches a sign-in identifier from the caller. It can no longer be
        used to sign in to this member.

        The last remaining identifier cannot be removed: the request is
        refused with `409` and `LAST_IDENTIFIER`, because the member would be
        left with no way to sign in. A password does not count as an
        identifier.

        An identifier that does not exist, or belongs to another member,
        returns `404` with `IDENTIFIER_NOT_FOUND`.
      parameters:
        - name: identifierId
          in: path
          required: true
          description: The `id` of the identifier, from `listOwnIdentifiers`.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JA8QW9K2M4N6P8Q0R2S4T6V8
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Identifier removed. No content.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such identifier on the caller's account (`IDENTIFIER_NOT_FOUND`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                identifierNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: IDENTIFIER_NOT_FOUND
                    detail: This sign-in method could not be found.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: This is the caller's last sign-in identifier (`LAST_IDENTIFIER`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                lastIdentifier:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: LAST_IDENTIFIER
                    detail: Add another way to sign in before removing this one.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-examples-note: >-
        This operation has no request or success body. Example exchange:
        `DELETE /api/v1/me/identifiers/01JA8QW9K2M4N6P8Q0R2S4T6V8` returns
        `204 No Content`.

  /me/capabilities:
    get:
      operationId: getOwnCapabilities
      tags: [Members]
      summary: Get the signed-in member's capabilities
      description: |
        Returns the capabilities the caller holds. Clients use this to decide
        which experience to offer (for example, whether to show the experience
        switcher). It is a presentation aid only: every protected operation
        checks authorization on the server.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The caller's capabilities.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCapabilities'
              examples:
                memberOnly:
                  summary: A member who is not a creator
                  value:
                    capabilities: [MEMBER]
                creator:
                  summary: A member who is also a creator
                  value:
                    capabilities: [MEMBER, CREATOR]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/creator-profile:
    post:
      operationId: becomeCreator
      tags: [Creator Profile]
      summary: Become a creator by creating the caller's creator profile
      description: |
        Adds the `CREATOR` capability to the caller and creates their creator
        profile. The member identity does not change; the same account and the
        same tokens keep working.

        A member has at most one creator profile in MVP1;
        a second call returns `409` with `CREATOR_PROFILE_EXISTS`. Because of
        that natural uniqueness the `Idempotency-Key`
        header is optional. A client that may retry after a timeout should send
        one so that the retry returns the original `201` instead of `409`.

        `country` must be a country the platform knows and has made active.
        An unknown code is `422` with field `country` and code
        `UNKNOWN_VALUE`; a known country that is not active is `422` with
        field `country` and code `NOT_AVAILABLE`. MVP1 has one active country,
        `ZA`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreatorProfileRequest'
            examples:
              minimal:
                summary: Only the required fields
                value:
                  handle: djthandi
                  displayName: DJ Thandi
                  category: dj
                  country: ZA
              full:
                summary: All optional fields
                value:
                  handle: djthandi
                  displayName: DJ Thandi
                  bio: Amapiano and deep house. Requests open on Fridays.
                  category: dj
                  country: ZA
                  city: Johannesburg
                  languages: [en, zu]
                  links:
                    - type: social
                      label: Instagram
                      url: https://social.example.com/djthandi
                    - type: livestream
                      label: Friday stream
                      url: https://stream.example.com/djthandi
      responses:
        '201':
          description: Creator profile created; the caller now holds the `CREATOR` capability.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: Always `/api/v1/me/creator-profile`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProfile'
              examples:
                created:
                  $ref: '#/components/examples/CreatorProfileExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            The caller already has a creator profile (`CREATOR_PROFILE_EXISTS`),
            the handle is taken or reserved (`HANDLE_TAKEN`), or the idempotency key
            was reused with a different request (`IDEMPOTENCY_KEY_REUSED`) or is
            still being processed (`IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                handleTaken:
                  $ref: '#/components/examples/ProblemHandleTaken'
                profileExists:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: CREATOR_PROFILE_EXISTS
                    detail: This member already has a creator profile.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                idempotencyKeyReused:
                  $ref: '#/components/examples/ProblemIdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getOwnCreatorProfile
      tags: [Creator Profile]
      summary: Get the signed-in member's own creator profile
      description: >-
        Returns the caller's creator profile, including fields that are not
        public. Returns `404` with `CREATOR_PROFILE_NOT_FOUND` when the caller
        is not a creator.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The caller's creator profile.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProfile'
              examples:
                profile:
                  $ref: '#/components/examples/CreatorProfileExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateOwnCreatorProfile
      tags: [Creator Profile]
      summary: Update the signed-in member's own creator profile
      description: |
        Partial update. Fields that are absent are left unchanged. A field sent
        as `null` is cleared where the schema allows `null`. `languages` and
        `links` are replaced as a whole when present.

        Changing `handle` renames the public profile. Printed QR codes keep
        working because they encode a QR identifier, not the handle. The old
        handle stays reserved for this creator and redirects to the new one;
        it is never released for another creator to claim.

        A new `country` follows the same rule as in `becomeCreator`: an
        unknown code is `422` with field code `UNKNOWN_VALUE`, and a country
        that is not active is `422` with field code `NOT_AVAILABLE`. A profile
        whose country has since become inactive keeps it and can still be
        updated, as long as the update does not move it to another country
        that is not active.

        Two updates of the same profile at the same time are applied one
        after the other. Each changes only the fields it names; there is no
        version check, so on a field both name the later one wins
        (`CONVENTIONS.md`, Section 9.1).
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreatorProfileRequest'
            examples:
              changeBio:
                value:
                  bio: Amapiano, deep house and the occasional throwback.
              rename:
                summary: Rename the handle
                value:
                  handle: thandi_live
              clearCity:
                summary: Clear an optional field
                value:
                  city: null
      responses:
        '200':
          description: The updated creator profile.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProfile'
              examples:
                updated:
                  $ref: '#/components/examples/CreatorProfileExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The requested handle is not available (`HANDLE_TAKEN`): it is
            another creator's current handle, or a handle another creator
            used before and that stays reserved for them.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                handleTaken:
                  $ref: '#/components/examples/ProblemHandleTaken'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /creators:
    get:
      operationId: searchCreators
      tags: [Discovery]
      summary: Search and list public creators
      description: |
        Returns a page of public creator summaries. All filters are optional
        and combine with AND. Only creators whose profile is publicly visible
        are returned.

        The order of results is decided by the server and is stable for the
        life of a cursor. No client-selectable sort exists yet.
      security: []
      parameters:
        - name: q
          in: query
          description: Free-text search over public profile text (name, handle, bio).
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: amapiano
        - name: category
          in: query
          description: Creator category code. Exact match.
          schema:
            $ref: '#/components/schemas/CategoryCode'
          example: dj
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code. Exact match.
          schema:
            $ref: '#/components/schemas/CountryCode'
          example: ZA
        - name: city
          in: query
          description: City or area name. Case-insensitive exact match.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: Johannesburg
        - name: language
          in: query
          description: BCP 47 language tag. Matches creators who list this language.
          schema:
            $ref: '#/components/schemas/LanguageTag'
          example: zu
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of public creator summaries.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCreatorPage'
              examples:
                firstPage:
                  summary: First page with more results available
                  value:
                    items:
                      - id: 01JA8PZK3M9R5T7V1X2Y4Z6A8B
                        handle: djthandi
                        displayName: DJ Thandi
                        imageUrl: https://media.example.com/creators/01JA8PZK3M9R5T7V1X2Y4Z6A8B/profile.jpg
                        category: dj
                        country: ZA
                        city: Johannesburg
                        languages: [en, zu]
                        verificationState: unverified
                    page:
                      limit: 20
                      hasMore: true
                      nextCursor: eyJvIjoyMH0
                empty:
                  summary: No matches
                  value:
                    items: []
                    page:
                      limit: 20
                      hasMore: false
                      nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /creators/by-handle/{handle}:
    get:
      operationId: getPublicCreatorByHandle
      tags: [Discovery]
      summary: Get a public creator profile by handle
      description: |
        Returns the public projection of a creator profile. The response
        contains only fields intended to be public.

        A handle that does not exist and a profile that is not publicly
        visible (for example, suspended) both return `404` with
        `CREATOR_NOT_FOUND`. The response does not distinguish the two.

        The handle is matched case-insensitively and is sent without the
        leading `@`.

        **Renamed handles.** After a rename the old handle stays reserved for
        the same creator and keeps resolving. A request for an old handle
        returns `200` with the creator's current profile: `handle` and
        `canonicalPath` carry the current handle, and `redirectedFrom` carries
        the old handle that was requested. A client that sees a non-null
        `redirectedFrom` replaces any stored handle or link with the current
        one. No HTTP redirect is used. An old handle always resolves straight
        to the current handle, however many renames lie between them.
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          description: Creator handle, without the leading `@`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: djthandi
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The public creator profile.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCreatorProfile'
              examples:
                profile:
                  value:
                    id: 01JA8PZK3M9R5T7V1X2Y4Z6A8B
                    handle: djthandi
                    displayName: DJ Thandi
                    bio: Amapiano and deep house. Requests open on Fridays.
                    imageUrl: https://media.example.com/creators/01JA8PZK3M9R5T7V1X2Y4Z6A8B/profile.jpg
                    category: dj
                    country: ZA
                    city: Johannesburg
                    languages: [en, zu]
                    verificationState: unverified
                    links:
                      - type: social
                        label: Instagram
                        url: https://social.example.com/djthandi
                    canonicalPath: /@djthandi
                    redirectedFrom: null
                renamed:
                  summary: An old handle was requested; the current profile is returned
                  description: Response to `GET /creators/by-handle/djthandi` after the creator renamed to `thandi_live`.
                  value:
                    id: 01JA8PZK3M9R5T7V1X2Y4Z6A8B
                    handle: thandi_live
                    displayName: DJ Thandi
                    bio: null
                    imageUrl: null
                    category: dj
                    country: ZA
                    city: Johannesburg
                    languages: [en, zu]
                    verificationState: unverified
                    links: []
                    canonicalPath: /@thandi_live
                    redirectedFrom: djthandi
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /qr/{qrId}:
    get:
      operationId: resolveQr
      tags: [QR]
      summary: Resolve a short opaque QR identifier
      description: |
        Returns the current status of a QR identifier and, when it is active,
        the canonical destination it points to. This is the API counterpart of
        the web route `/q/{id}`, for clients that scan a code in-app.

        Safe results:

        - **Unknown identifier**, including one that is malformed: `404` with
          `QR_NOT_FOUND`. The two cases are not distinguished.
        - **Known but not active** (`inactive`, `suspended`, `expired`,
          `revoked`): `200` with that `status` and `destination: null`. No
          information about the former destination is returned.
        - **Active, but the destination is not publicly visible** (for example,
          the creator profile is suspended): `200` with
          `status: destination_unavailable` and `destination: null`.
        - **Active**: `200` with `status: active` and a `destination`.

        A resolver never falls back to a different recipient. The destination
        is always a canonical path on the platform's own web origin; it is
        never an arbitrary external URL, so a client cannot be used as an open
        redirect. Resolution grants no access: anything the destination allows
        is still subject to normal authorization.
      security: []
      parameters:
        - name: qrId
          in: path
          required: true
          description: >-
            The short opaque identifier encoded in the QR code (the `{id}` of
            `/q/{id}`). Case-sensitive. Clients pass it through unchanged.
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: 7Hk2Pz
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The identifier is known. Check `status` before using `destination`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResolution'
              examples:
                activeCreatorProfile:
                  summary: Active, pointing at a creator profile
                  value:
                    qrId: 7Hk2Pz
                    status: active
                    destination:
                      type: creator_profile
                      creatorHandle: djthandi
                      actionSlug: null
                      canonicalPath: /@djthandi
                activeCreatorAction:
                  summary: Active, pointing at a specific Creator Action
                  value:
                    qrId: 9Qw4Lm
                    status: active
                    destination:
                      type: creator_action
                      creatorHandle: djthandi
                      actionSlug: request
                      canonicalPath: /@djthandi/request
                suspended:
                  summary: Suspended identifier
                  value:
                    qrId: 3Bn8Xr
                    status: suspended
                    destination: null
                revoked:
                  summary: Revoked identifier
                  value:
                    qrId: 5Tc1Vd
                    status: revoked
                    destination: null
                destinationUnavailable:
                  summary: Active identifier whose destination is not publicly visible
                  value:
                    qrId: 2Jf6Ys
                    status: destination_unavailable
                    destination: null
        '404':
          description: Unknown or malformed identifier. Always `QR_NOT_FOUND`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknown:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: QR_NOT_FOUND
                    detail: This code is not recognised.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/following:
    get:
      operationId: listFollowedCreators
      tags: [Following]
      summary: List the creators the signed-in member follows
      description: >-
        Returns a page of the caller's follows, most recently followed first.
        Each item carries the public summary of the creator.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of followed creators.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
