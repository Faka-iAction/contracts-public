  /actions/{actionId}/payments:
    post:
      operationId: createPayment
      tags:
        - Payments
      summary: Start an online payment for an Action
      description: |
        Creates a payment for the caller's Action with one of the online methods from
        `listActionPaymentMethods`, and returns what the client needs to send the payer to checkout.
        The Action moves from `CREATED` to `INITIATED`.

        **The server computes the amount.** The request carries no amount: the server charges the
        amount due for the Action (the fixed price, or the tip or bid amount that was validated when
        the Action was submitted). The payer and the recipient are also fixed by the Action.

        `checkout` tells the client how to continue; in this version the only type is `REDIRECT`,
        where the client opens `checkout.url`. The client treats an unknown type as "open the
        Action's web page". The payment expires at `expiresAt` if it is not completed.

        **A return from the provider is never proof of payment.** Whatever the provider's page or
        redirect says, the client calls `getPayment` and trusts only the state it returns. The server
        learns the outcome from the provider directly, through a signed provider notification or a
        server-to-server query. That notification endpoint is provider-specific and is not part of
        this client contract.

        Only one payment per Action can be open at a time. If one is already `CREATED` or `PENDING`
        the response is `409` with `PAYMENT_ALREADY_IN_PROGRESS`; the client continues that payment
        (`getAction` lists it) or waits for it to expire. After a payment has failed or expired, a
        new one can be created while the Action is still `INITIATED`. To raise a bid, use `raiseBid`.

        `Idempotency-Key` is required. A retry with the same key returns the same payment and never
        charges twice.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              card:
                value:
                  method: CARD
      responses:
        '201':
          description: Payment created. Replaying the request with the same `Idempotency-Key` returns
            this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              description: '`/api/v1/payments/{paymentId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                redirect:
                  value:
                    id: 01JAB4P6Q8R0S2T4V6W8X0Y2Z4
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    purpose: INITIAL
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    method: CARD
                    state: PENDING
                    checkout:
                      type: REDIRECT
                      url: https://checkout.example.com/session/abc123
                    expiresAt: '2026-10-12T20:30:00Z'
                    confirmedAt: null
                    failureCode: null
                    refund: null
                    createdAt: '2026-10-12T20:00:30Z'
                    updatedAt: '2026-10-12T20:00:31Z'
        '400':
          $ref: '#/components/responses/BadRequestOrMissingIdempotencyKey'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '403':
          description: A platform control declined the payment (`PARTICIPATION_DECLINED`, `TRANSACTION_LIMIT_EXCEEDED`).
            No reason is given.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                participationDeclined:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: PARTICIPATION_DECLINED
                    detail: This cannot be completed right now.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                transactionLimitExceeded:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: TRANSACTION_LIMIT_EXCEEDED
                    detail: This amount is over the limit that applies.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '404':
          description: No such Action for this caller (`ACTION_NOT_FOUND`). An Action that belongs
            to someone else is not distinguished from one that does not exist.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                actionNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: ACTION_NOT_FOUND
                    detail: This could not be found.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: The Action cannot be paid for now (`ACTION_NOT_PAYABLE`), a payment is already
            open (`PAYMENT_ALREADY_IN_PROGRESS`), a cash report is pending (`CASH_RECEIPT_STATE_CONFLICT`),
            the method is not available (`PAYMENT_METHOD_NOT_AVAILABLE`), or the idempotency key
            was misused.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                actionNotPayable:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: ACTION_NOT_PAYABLE
                    detail: This does not need a payment right now.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                paymentAlreadyInProgress:
                  value:
