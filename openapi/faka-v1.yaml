  /creator-actions/{creatorActionId}/vote-tally:
    get:
      operationId: listPublicVoteTally
      tags:
        - Public Actions
      summary: Read the result of a closed Vote
      description: |
        Added in 1.0.0-alpha.2. Returns the number of votes each option received, once voting has
        closed. Vote tallies are shown to participants once voting closes, not before (decision 21);
        voting closes when the Creator Action expires (decision 20).

        While voting is still open the response is `409` with `VOTE_TALLY_NOT_AVAILABLE`, and no
        partial count is given. A disabled Vote has no result, because disabling cancelled its votes
        (decision 18); it also gives `409 VOTE_TALLY_NOT_AVAILABLE`.

        Counts are made from the votes that count (`SUBMITTED` or `COMPLETED`), never from a stored
        counter. Rows follow the display order of the options, and every option appears, with `0`
        where it received no vote.

        The operation is public, like the Creator Action page it belongs to. Whether a closed result
        should instead be limited to the people who voted is open (`CONVENTIONS.md`, Section 15,
        item 85).
      security: []
      parameters:
        - name: creatorActionId
          in: path
          required: true
          description: The `id` of a public Vote.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JAB2C4D6E8F0G2H4J6K8M0N2
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of tally rows, in the display order of the options.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteTallyPage'
              examples:
                closed:
                  value:
                    items:
                      - optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        votes: 42
                      - optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q7
                        label: Mnike
                        votes: 37
                    page:
                      limit: 20
                      hasMore: false
                      nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such Creator Action, or it is not a Vote (`CREATOR_ACTION_NOT_FOUND`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                creatorActionNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: CREATOR_ACTION_NOT_FOUND
                    detail: This Action could not be found.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: Voting has not closed, or the Vote was disabled (`VOTE_TALLY_NOT_AVAILABLE`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                votingOpen:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: VOTE_TALLY_NOT_AVAILABLE
                    detail: The result is shown when voting closes.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /guest-sessions:
    post:
      operationId: createGuestSession
      tags:
        - Participation
      summary: Start a guest session
      description: |
        Creates a guest session and returns its token. A guest is a limited principal for a visitor
        who takes part without registering. Creating a guest session never creates a member.

        The client stores `guestToken` and sends it in the `X-Guest-Token` header on participation,
        payment and status operations. The token is the only way to read the guest's Actions later;
        it is shown once and cannot be recovered. It grants access to that guest's own Actions and
        payments and to nothing else. It expires at `guestSession.expiresAt`. A guest session lasts
        30 days and is renewed on use (decision 23): every request that presents the token moves its
        expiry to 30 days after that request. The 30 days are a decision; the server holds them as
        configuration.

        A guest session is not needed to browse. A client creates one when a visitor first takes part
        and reuses it for that visitor afterwards. The operation is rate limited.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestSessionRequest'
            examples:
              withLocale:
                summary: Optional hints for language and country
                value:
                  country: ZA
                  locale: en-ZA
              empty:
                summary: No hints
                value: {}
      responses:
        '201':
          description: Guest session created. The token is shown only in this response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionCreated'
              examples:
                created:
                  value:
                    guestSession:
                      id: 01JAB9G1H3J5K7M9N1P3Q5R7S9
                      expiresAt: '2026-11-11T20:00:00Z'
                    guestToken: gt_example_5c1f0a9b8e7d6c5b4a39281706f5e4d3
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /creator-actions/{creatorActionId}/requests:
    post:
      operationId: submitRequest
      tags:
        - Participation
      summary: Submit a Request
      description: |
        A participant chooses something the creator has made available.

        The caller is a signed-in member (bearer token) or a guest (`X-Guest-Token`, from
        `createGuestSession`). A guest may take part only where the Creator Action allows guests;
        otherwise the response is `403` with `GUEST_NOT_ALLOWED`. Taking part never creates a member
        account.

        `Idempotency-Key` is required. A retry with the same key and the same body returns the first
        result and never creates a second Action or a second payment.

        `configVersion` is the version the participant was shown (from `getPublicCreatorAction`). If
        the creator has changed the configuration since, the response is `409` with
        `ACTION_CONFIG_CHANGED`; the client reloads the Creator Action, shows the new terms and
        submits again with a new key.

        **Free Request:** it completes without payment. The Action is returned in state `SUBMITTED`
        (or `ACCEPTED` when the creator's approval is not required), `paymentRequired` is `false` and
        `paymentMethods` is empty.

        **Paid Request:** the Action is returned in state `CREATED`. It does not count yet.
        `action.amount` is the amount due, computed by the server, and `paymentMethods` lists the
        methods the participant can use. The client then calls `createPayment` for an online method
        or `reportCashPayment` for cash.

        A submission that needs a payment is refused with `503` and `PAYMENT_PROVIDER_UNAVAILABLE`
        while no payment provider is configured on the server or the provider cannot be reached.
        Nothing is stored and nothing is charged; the client may retry with the same
        `Idempotency-Key`. A free submission never depends on the provider.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - name: creatorActionId
          in: path
          required: true
          description: The `id` of a public Creator Action.
          schema:
            $ref: '#/components/schemas/Id'
          example: 01JAB2C4D6E8F0G2H4J6K8M0N2
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestRequest'
            examples:
              chooseSong:
                value:
                  configVersion: 1
                  optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
      responses:
        '201':
          description: Request stored. Replaying the request with the same `Idempotency-Key` returns
            this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: '`/api/v1/actions/{actionId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
              examples:
                paid:
                  summary: A paid Request, waiting for payment
                  value:
                    action:
                      id: 01JAB3A5B7C9D1E3F5G7H9J1K3
                      type: REQUEST
                      state: CREATED
                      creatorAction:
                        id: 01JAB2C4D6E8F0G2H4J6K8M0N2
                        type: REQUEST
                        slug: request
                        title: Request a song
                        creatorHandle: djthandi
                        creatorDisplayName: DJ Thandi
                      configVersion: 1
                      paymentRequirement: PAID
                      amount:
                        amountMinor: 2000
                        currency: ZAR
                      paymentMethod: null
                      selection:
                        optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        secondaryLabel: Tyla
                      note: null
                      message: null
                      customFieldValue: null
                      bid: null
                      payments: []
                      cashReceipt: null
                      fulfilmentDeadlineAt: null
                      canCancel: true
                      canRaise: false
                      closeReason: null
                      createdAt: '2026-10-12T20:00:00Z'
                      submittedAt: null
                      acceptedAt: null
                      fulfilledAt: null
                      closedAt: null
                      updatedAt: '2026-10-12T20:00:00Z'
                    paymentRequired: true
                    paymentMethods:
                      - code: CARD
                        kind: ONLINE
                        displayName: Card
                      - code: CASH_IN_PERSON
                        kind: CASH_IN_PERSON
                        displayName: Cash in person
                free:
                  summary: A free Request, already submitted
                  value:
                    action:
                      id: 01JAB3A5B7C9D1E3F5G7H9J1K3
                      type: REQUEST
                      state: SUBMITTED
                      creatorAction:
                        id: 01JAB2C4D6E8F0G2H4J6K8M0N2
                        type: REQUEST
                        slug: request
                        title: Request a song
                        creatorHandle: djthandi
                        creatorDisplayName: DJ Thandi
                      configVersion: 1
                      paymentRequirement: FREE
                      amount: null
                      paymentMethod: FREE
                      selection:
                        optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                        label: Water
                        secondaryLabel: Tyla
                      note: null
                      message: null
                      customFieldValue: null
                      bid: null
                      payments: []
                      cashReceipt: null
                      fulfilmentDeadlineAt: null
                      canCancel: false
                      canRaise: false
                      closeReason: null
                      createdAt: '2026-10-12T20:00:00Z'
                      submittedAt: '2026-10-12T20:00:00Z'
                      acceptedAt: null
