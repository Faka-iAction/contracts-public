  /me/cash-receipts/{cashReceiptId}/corrections:
    post:
      operationId: correctCashReceipt
      tags:
        - Cash in Person
      summary: Correct a confirmed cash receipt
      description: |
        Records a correction to a cash receipt that was confirmed by mistake: the wrong amount, the
        wrong Action, or cash that was not actually received.

        **A confirmed receipt is never edited or deleted.** The correction is a new, compensating
        cash receipt that points at the original through `correctsCashReceiptId` and carries a
        `correctionReason`. The original stays `CASH_CONFIRMED_BY_CREATOR` and stays visible. `amount`
        on the correction is the amount the creator now attests was actually received; zero means no
        cash was received.

        A correction changes the record only. It moves no money, creates no refund and does not by
        itself change the state of the Action.

        `Idempotency-Key` is required. Only a confirmed, original receipt can be corrected.
      parameters:
        - $ref: '#/components/parameters/CashReceiptId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectCashReceiptRequest'
            examples:
              wrongAmount:
                value:
                  amount:
                    amountMinor: 1000
                    currency: ZAR
                  reason: Customer paid R10, not R20
              notReceived:
                value:
                  amount:
                    amountMinor: 0
                    currency: ZAR
                  reason: Confirmed the wrong customer
      responses:
        '201':
          description: The compensating cash receipt. Replaying the request with the same `Idempotency-Key`
            returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
