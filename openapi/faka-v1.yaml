              examples:
                actionNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    code: ACTION_NOT_FOUND
                    detail: This could not be found.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: The Action can no longer be cancelled (`ACTION_NOT_CANCELLABLE`), or a payment
            outcome is not yet known (`PAYMENT_ALREADY_IN_PROGRESS`).
          headers:
            X-Correlation-Id:
