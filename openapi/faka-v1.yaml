          type: integer
          format: int32
          description: Version of the current configuration. Starts at 1 and increases by one on every
            configuration change.
          minimum: 1
        config:
          $ref: '#/components/schemas/CreatorActionConfig'
        canonicalPath:
          type: string
          description: Canonical path of the public page, for example `/@djthandi/request`.
          pattern: ^/@[a-z0-9_]+/[a-z0-9-]+$
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
