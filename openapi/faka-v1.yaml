  /me/ledger-entries:
    get:
      operationId: listOwnLedgerEntries
      tags:
        - Creator Money
      summary: List the ledger entries behind the caller's balance (read-only)
      description: |
        Returns a page of ledger-derived entries for the caller's creator profile, most recent first.
        These are the records the pending balance is calculated from: payments, fees, refunds,
        chargebacks, payouts and payout fees. The ledger is append-only: an entry is never changed,
        and a correction is a new entry that points at the one it reverses (`reversesEntryId`).

        Amounts are signed from the creator's point of view: positive adds to the creator's
        entitlement, negative reduces it. A payout shows as `CREATOR_PAYOUT` (negative) and, where
        the creator bears it, `PAYOUT_FEE` (negative), with `payoutId`. A payout that the provider
        failed or reversed shows the same types again, positive, each pointing at the entry it
        reverses.

        Cash entries (`cashMemo: true`) are a record of the creator's own attestation. They are
        included so that a creator can see everything in one place, are excluded by default from
        nothing, and are never counted in any balance; use `cashMemo` to show them apart or filter
        them out.
      parameters:
        - name: entryType
          in: query
          description: Only entries of this type.
          schema:
            $ref: '#/components/schemas/LedgerEntryType'
          example: ACTION_PAYMENT
        - name: cashMemo
          in: query
          description: '`true` for cash memo entries only; `false` to leave them out.'
          schema:
            type: boolean
          example: false
        - name: occurredFrom
          in: query
          description: Only entries at or after this instant.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-10-01T00:00:00Z'
        - name: occurredBefore
          in: query
          description: Only entries before this instant.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-11-01T00:00:00Z'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of ledger entries.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
