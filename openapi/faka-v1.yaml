        it right now. **The server decides the list**, from the Creator Action's configuration, the
        country, the payment provider's availability, the Action type and platform controls. A client
        offers only what is returned and never assumes a method.

        `CASH_IN_PERSON` appears only where the Creator Action enables cash and the creator's profile
        is self-managed. It never appears for a Bid. An Action that needs no payment returns an empty
        list and `amountDue` `null`.

        Method codes other than `CASH_IN_PERSON` are not fixed by this contract; a client displays
        `displayName` and sends `code` back unchanged.
      security:
