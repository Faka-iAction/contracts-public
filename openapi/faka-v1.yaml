        Publishing checks that the configuration is complete for the type, that a paid
        configuration (other than a Tip) has a fulfilment deadline rule that falls inside the
        settlement cool-off, that cash is enabled only where it is allowed, and that platform
        policy passes. If a check fails the response is `409` with `CREATOR_ACTION_NOT_PUBLISHABLE`
        and `errors` names each field.

        A creator does not need a Settlement Profile to publish a paid Creator Action.

        Repeating the call on a Creator Action that is already `PUBLISHED` or `ACTIVE` returns `200`
        with its current state and changes nothing.
