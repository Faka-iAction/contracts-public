    post:
      operationId: rejectAction
      tags:
        - Creator Queue
      summary: Reject an incoming Action (refund follows automatically)
      description: |
        The creator declines a `SUBMITTED` or `ACCEPTED` Action that has not been fulfilled. It moves
        to `REJECTED`.

        **If the Action was paid online, every confirmed payment of it is refunded in full,
        automatically.** For a bid that includes the first payment and every raise. No platform fee
        is kept. The creator does not start the refund and cannot stop it; the refund is carried out
        after this call returns and its progress is on the payment. Cash paid in person is not
        refunded by the platform: returning it is between the creator and the customer.

        A rejected bid leaves the ranking and the bids below it move up.

        Repeating the call on a `REJECTED` Action returns `200` and changes nothing; nothing is
        refunded twice.
