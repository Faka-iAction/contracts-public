                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    actionType: REQUEST
                    creatorActionTitle: Request a song
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    state: CASH_CONFIRMED_BY_CREATOR
