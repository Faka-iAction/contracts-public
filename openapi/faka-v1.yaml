    PublicCreatorAction:
      type: object
      description: 'Public projection of a Creator Action. This is an allowlist: a server must not
        return any property that is not listed here.'
      additionalProperties: false
      required:
        - id
        - type
        - slug
        - title
        - description
        - state
        - openForParticipation
        - startsAt
        - endsAt
        - creatorHandle
        - canonicalPath
        - configVersion
        - paymentRequirement
        - price
        - minimumBid
        - bidIncrement
        - tipMinimum
        - tipMaximum
        - tipSuggestedAmounts
        - guestParticipationAllowed
        - approvalRequired
        - acceptedPaymentMethods
        - fulfilmentDeadline
        - hasOptions
        - votesPerParticipant
        - messageEnabled
        - messageMaxLength
        - customFieldEnabled
        - customFieldLabel
        - customFieldMaxLength
        - bidRanking
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ActionType'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        state:
          type: string
          description: Only these three states are ever public.
          enum:
            - PUBLISHED
            - ACTIVE
            - PAUSED
        openForParticipation:
          type: boolean
          description: '`true` only when the state is `ACTIVE` and the creator''s profile is public.'
        startsAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        endsAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        creatorHandle:
          $ref: '#/components/schemas/Handle'
        canonicalPath:
          type: string
          pattern: ^/@[a-z0-9_]+/[a-z0-9-]+$
        configVersion:
          type: integer
          format: int32
          description: Version of the configuration these terms come from. Sent back when submitting.
          minimum: 1
        paymentRequirement:
          type: string
          enum:
            - FREE
            - PAID
        price:
          description: Fixed price of a paid Request or Shout-out.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        minimumBid:
          description: 'Bid: the lowest bid accepted.'
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        bidIncrement:
          description: 'Bid: the step above the minimum, and the least raise.'
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        tipMinimum:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        tipMaximum:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        tipSuggestedAmounts:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Money'
        guestParticipationAllowed:
          type: boolean
          description: Whether a guest may take part without an account.
        approvalRequired:
          type: boolean
          description: Whether the creator approves each Action before fulfilling it.
        acceptedPaymentMethods:
          type: array
          description: Methods generally accepted for this Creator Action. Empty when free. The list
            for one participant's Action comes from `listActionPaymentMethods` and may be shorter.
          maxItems: 20
          items:
            $ref: '#/components/schemas/PaymentMethodOption'
        fulfilmentDeadline:
          description: '`null` for a free Action with no deadline rule and for a Tip.'
          oneOf:
            - $ref: '#/components/schemas/FulfilmentDeadlineInfo'
            - type: 'null'
        hasOptions:
          type: boolean
          description: Whether the participant picks from `listPublicActionOptions`.
        votesPerParticipant:
          type:
            - integer
            - 'null'
          format: int32
          description: 'Vote: how many votes one participant may cast.'
          minimum: 1
        messageEnabled:
          type: boolean
        messageMaxLength:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
        customFieldEnabled:
          type: boolean
        customFieldLabel:
          type:
            - string
            - 'null'
          maxLength: 120
        customFieldMaxLength:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
        bidRanking:
          description: Bid only; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/BidRankingSummary'
            - type: 'null'
