  /me/creator-actions/{creatorActionId}/disable:
    post:
      operationId: disableCreatorAction
      tags:
        - Creator Actions
      summary: Disable a Creator Action (cancels and refunds unfulfilled Actions)
      description: |
        Moves the Creator Action to `DISABLED` from any other state. It is removed from the
        creator's page and accepts no participation.

        **Disabling cancels every unfulfilled participant Action on it, paid or free** (decisions 6
        and 18). Each one moves to `CANCELLED`, and every confirmed online payment of those Actions
        is refunded in full,
        automatically. No platform fee is kept. The refunds are carried out after this call
        returns; their progress is visible on each payment. Cash paid in person is not refunded by
        the platform, because the platform never held it. Actions that are already fulfilled are
        not affected.

        The client should ask the creator to confirm before calling this. There is no operation
        to re-enable a disabled Creator Action in this version of the contract.

        Repeating the call on a `DISABLED` Creator Action returns `200` and changes nothing; nothing
        is refunded twice.
      parameters:
        - $ref: '#/components/parameters/CreatorActionId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The Creator Action in its new state.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorAction'
              examples:
                disabled:
                  value:
                    id: 01JAB2C4D6E8F0G2H4J6K8M0N2
                    type: REQUEST
                    slug: request
                    title: Request a song
                    description: Pick a track from tonight's set.
                    state: DISABLED
