    patch:
      operationId: updateOwnCreatorAction
      tags:
        - Creator Actions
      summary: Update a Creator Action
      description: |
        Partial update. Absent fields are unchanged. Inside `config`, fields that are present replace
        the current values and the merged configuration is validated as a whole.

        **A change to `config` creates a new configuration version** (decision 19). `configVersion`
        increases by one. The new version applies to new participants only: every participant Action
        already made keeps the version, price, deadline and terms it was made under. A change to
        `title`, `description`, `startsAt` or `endsAt` alone does not create a new version.

        `type` and `slug` cannot be changed. A `DISABLED` Creator Action cannot be updated. On a
        Creator Action that is not a draft, the merged configuration must still satisfy the publish
        rules; otherwise the update is refused with `CREATOR_ACTION_NOT_PUBLISHABLE`.

        If another change to the same Creator Action (an update, a state change or a scheduled
        transition) is committed between the moment the server reads it and the moment it writes
        this update, the update is refused with `409 CREATOR_ACTION_STATE_CONFLICT` and nothing is
        written. The client reloads the Creator Action and sends the update again (`CONVENTIONS.md`,
        Section 9.1).
      parameters:
        - $ref: '#/components/parameters/CreatorActionId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreatorActionRequest'
            examples:
              changePrice:
                summary: Change the price (creates a new configuration version)
                value:
                  config:
                    price:
                      amountMinor: 3000
                      currency: ZAR
              setEndTime:
                summary: Set an end time
                value:
                  endsAt: '2026-10-13T02:00:00Z'
      responses:
        '200':
          description: The updated Creator Action.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorAction'
              examples:
