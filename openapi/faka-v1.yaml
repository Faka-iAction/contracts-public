  /actions/{actionId}/bid-raises:
    post:
      operationId: raiseBid
      tags:
        - Participation
      summary: Raise a Bid
      description: |
        Starts a further payment that raises the caller's bid. The payment is for the increase only;
        the bid's rank is based on the bidder's total once the raise is confirmed.

        `amount` is the increase, not the new total. It must be at least one bid increment, in
        increment steps, in the bid's currency (`BELOW_MINIMUM`, `NOT_IN_INCREMENT`,
        `CURRENCY_MISMATCH`). A raise is allowed only while the bid is ranked (`action.canRaise` is
        `true`) and the Creator Action is open; otherwise the response is `409` with
        `BID_NOT_RAISABLE`.

        The response is a payment, exactly as from `createPayment`, with `purpose` `BID_RAISE`. The
        raise takes effect only when that payment becomes `CONFIRMED`. A raise payment that fails or
        expires changes nothing: the bid keeps its total and rank. A raise does not move the
        fulfilment deadline. A raise cannot be paid in cash.

        `Idempotency-Key` is required.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseBidRequest'
            examples:
              raise:
                value:
                  amount:
                    amountMinor: 1000
                    currency: ZAR
                  method: CARD
                  bidTermsAcknowledged: true
      responses:
        '201':
          description: Raise payment created. Replaying the request with the same `Idempotency-Key`
            returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              description: '`/api/v1/payments/{paymentId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                raise:
                  value:
                    id: 01JAB4P6Q8R0S2T4V6W8X0Y2Z4
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    purpose: BID_RAISE
                    amount:
                      amountMinor: 1000
                      currency: ZAR
                    method: CARD
                    state: PENDING
                    checkout:
                      type: REDIRECT
                      url: https://checkout.example.com/session/abc123
                    expiresAt: '2026-10-12T20:30:00Z'
                    confirmedAt: null
                    failureCode: null
                    refund: null
                    createdAt: '2026-10-12T20:00:30Z'
                    updatedAt: '2026-10-12T20:00:31Z'
        '400':
          $ref: '#/components/responses/BadRequestOrMissingIdempotencyKey'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '403':
          description: A platform control declined the payment (`PARTICIPATION_DECLINED`, `TRANSACTION_LIMIT_EXCEEDED`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                participationDeclined:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: PARTICIPATION_DECLINED
                    detail: This cannot be completed right now.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                transactionLimitExceeded:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: TRANSACTION_LIMIT_EXCEEDED
                    detail: This amount is over the limit that applies.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '404':
          description: No such Action for this caller (`ACTION_NOT_FOUND`). An Action that belongs
            to someone else is not distinguished from one that does not exist.
          headers:
