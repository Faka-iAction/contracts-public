                      maxBidsPerParticipant: null
                      tipMinimum: null
                      tipMaximum: null
                      tipSuggestedAmounts: []
                      cashInPersonEnabled: true
                      guestParticipationAllowed: true
                      approvalRequired: true
                      fulfilmentDeadlineRule: FIXED_PERIOD_AFTER_PAYMENT
                      fulfilmentPeriodSeconds: 7200
                      quantityLimit: null
                      duplicateSelectionsAllowed: false
                      votesPerParticipant: null
                      optionsSource: PLAYLIST
