                    confirmedAt: '2026-10-12T21:00:00Z'
                    note: null
                    voidedAt: null
                    correctsCashReceiptId: 01JAB5C7D9E1F3G5H7J9K1M3N5
                    correctionReason: Customer paid R10, not R20
