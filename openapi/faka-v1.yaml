        the creator has changed the configuration since, the response is `409` with
        `ACTION_CONFIG_CHANGED`; the client reloads the Creator Action, shows the new terms and
        submits again with a new key.

        The message must be inside the configured length. It is screened before any payment is
        taken; a message that fails screening is rejected with `422` and field code `NOT_ALLOWED`,
        and nothing is charged. After payment the message may still need the creator's approval or
        moderation; if it is then rejected the Action becomes `REJECTED` and any confirmed online
        payment is refunded in full automatically.

        A free Shout-out is returned in state `SUBMITTED` or `ACCEPTED`. A paid one is returned in
        state `CREATED`, as for a paid Request.

        A submission that needs a payment is refused with `503` and `PAYMENT_PROVIDER_UNAVAILABLE`
        while no payment provider is configured on the server or the provider cannot be reached.
        Nothing is stored and nothing is charged; the client may retry with the same
        `Idempotency-Key`. A free submission never depends on the provider.
