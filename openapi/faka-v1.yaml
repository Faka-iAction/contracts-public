    CreatorAction:
      type: object
      description: A Creator Action as its owner sees it.
      required:
        - id
        - type
        - slug
        - title
        - description
        - state
        - startsAt
        - endsAt
        - configVersion
        - config
        - canonicalPath
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ActionType'
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          type: string
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
        state:
          $ref: '#/components/schemas/CreatorActionState'
        startsAt:
          description: When participation opens; `null` to open as soon as it is published.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        endsAt:
          description: When participation closes and the Creator Action becomes `EXPIRED`; `null`
            for no end time.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
