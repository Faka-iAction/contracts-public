  /creators/by-handle/{handle}/actions/{actionSlug}:
    get:
      operationId: getPublicCreatorAction
      tags:
        - Public Actions
      summary: Get one public Creator Action
      description: |
        Returns what a participant needs to see before taking part: the price, or the minimum bid
        and increment, or the tip range; the fulfilment deadline rule; whether guests may take part;
        the payment methods accepted; and, for a Bid, a summary of the current ranking.

        The handle and slug are the two segments of the canonical page `/@handle/slug`, which is also
        what `resolveQr` returns for an Action destination. The client keeps `id` and `configVersion`
        from this response and sends them when the participant submits.

        Amounts, limits and periods are configuration that the server fills in. The client displays
        them and never assumes them. For a Bid the client must tell the participant, before payment,
        that they are charged now, that being outbid lowers their position.
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          description: Creator handle, without the leading `@`. An old handle is accepted and resolves
            to the same creator.
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: djthandi
        - name: actionSlug
          in: path
          required: true
          description: 'The Creator Action''s slug: the last segment of `/@handle/slug`.'
          schema:
            type: string
            minLength: 1
            maxLength: 60
          example: request
