              examples:
                ranked:
                  value:
                    actionId: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    rank: 3
                    rankedBidCount: 4
                    total:
                      amountMinor: 3000
                      currency: ZAR
                    asOf: '2026-10-12T20:10:00Z'
