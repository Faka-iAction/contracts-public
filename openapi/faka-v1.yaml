                        currency: ZAR
                      - amountMinor: 10000
                        currency: ZAR
      responses:
        '201':
          description: Creator Action created in `DRAFT`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: '`/api/v1/me/creator-actions/{creatorActionId}`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorAction'
              examples:
                created:
                  value:
                    id: 01JAB2C4D6E8F0G2H4J6K8M0N2
                    type: REQUEST
                    slug: request
                    title: Request a song
                    description: Pick a track from tonight's set.
                    state: DRAFT
                    startsAt: null
                    endsAt: null
                    configVersion: 1
                    config:
                      paymentRequirement: PAID
                      price:
                        amountMinor: 2000
                        currency: ZAR
                      minimumBid: null
                      bidIncrement: null
                      rankingRule: null
                      maxBidsPerParticipant: null
                      tipMinimum: null
                      tipMaximum: null
                      tipSuggestedAmounts: []
                      cashInPersonEnabled: true
                      guestParticipationAllowed: true
                      approvalRequired: true
                      fulfilmentDeadlineRule: FIXED_PERIOD_AFTER_PAYMENT
                      fulfilmentPeriodSeconds: 7200
