        Tip.'
      required:
        - body
        - moderationStatus
      properties:
        body:
          type: string
          maxLength: 2000
        moderationStatus:
          type: string
          description: Further values may be added.
          enum:
            - PENDING
            - APPROVED
            - REJECTED
    BidStatus:
      type: object
      description: Ranking information of a Bid. Rank is shown to the creator and to bidders; it is
        not enforced on fulfilment.
      required:
        - total
        - rank
        - rankedBidCount
        - raiseCount
      properties:
        total:
          description: 'Sum of the bid''s confirmed payments: the first payment plus every confirmed
            raise. Zero before the first payment is confirmed.'
          $ref: '#/components/schemas/Money'
        rank:
          type:
            - integer
            - 'null'
          format: int32
          description: Current rank; 1 is first. `null` while the bid is not ranked.
          minimum: 1
        rankedBidCount:
          type: integer
          format: int32
          description: How many bids are currently ranked on the Creator Action.
          minimum: 0
        raiseCount:
          type: integer
          format: int32
          description: How many confirmed raises the bid has had.
          minimum: 0
    RefundSummary:
      type: object
      description: Status of the refund of one payment. Refunds are started by the platform, never
        by a client.
      required:
        - status
        - reason
        - amount
        - requestedAt
        - succeededAt
      properties:
        status:
          $ref: '#/components/schemas/RefundStatus'
        reason:
          $ref: '#/components/schemas/RefundReason'
        amount:
          description: Always the full amount of the payment. There are no partial refunds.
          $ref: '#/components/schemas/Money'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        succeededAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    PaymentSummary:
      type: object
      description: One online payment of an Action, in brief.
      required:
        - id
        - purpose
        - amount
        - method
        - state
        - refund
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          description: '`INITIAL`: the payment for the Action. `BID_RAISE`: a further payment that
            raises a bid.'
          enum:
            - INITIAL
            - BID_RAISE
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        state:
          $ref: '#/components/schemas/PaymentState'
        refund:
          oneOf:
            - $ref: '#/components/schemas/RefundSummary'
            - type: 'null'
    CashReceiptSummary:
      type: object
      description: The cash receipt of an Action, as the participant sees it.
      required:
        - id
        - state
        - amount
        - reportedAt
        - confirmedAt
        - voidedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/CashReceiptState'
        amount:
          $ref: '#/components/schemas/Money'
        reportedAt:
          $ref: '#/components/schemas/Timestamp'
        confirmedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        voidedAt:
          description: Set when the creator said the cash was not received, or the confirmation window
            closed. The state does not change.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ParticipantAction:
      type: object
      description: A participant Action as the participant who made it sees it. Private to that participant.
      required:
        - id
        - type
        - state
        - creatorAction
        - configVersion
        - paymentRequirement
        - amount
        - paymentMethod
        - selection
        - note
        - message
        - customFieldValue
        - bid
        - payments
        - cashReceipt
        - fulfilmentDeadlineAt
        - canCancel
        - canRaise
        - closeReason
        - createdAt
        - submittedAt
        - acceptedAt
        - fulfilledAt
        - closedAt
        - updatedAt
      properties:
        id:
          description: The Action's reference. It is what a receipt or status page shows.
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ActionType'
        state:
          $ref: '#/components/schemas/ActionState'
        creatorAction:
          $ref: '#/components/schemas/ActionCreatorActionSummary'
        configVersion:
          type: integer
          format: int32
          description: The configuration version the Action was made under. Its price, deadline and
            terms do not change if the creator edits the Creator Action later.
          minimum: 1
        paymentRequirement:
          type: string
          enum:
            - FREE
            - PAID
        amount:
          description: The amount due for the Action, computed by the server; `null` when free. For
            a Bid, the amount of the bid.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        paymentMethod:
          description: 'The method chosen: `FREE`, `CASH_IN_PERSON` or an online method code. `null`
            until one is chosen.'
          oneOf:
            - $ref: '#/components/schemas/PaymentMethodCode'
            - type: 'null'
        selection:
          description: The choice made on a Request or Vote; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/ActionSelection'
            - type: 'null'
        note:
          type:
            - string
            - 'null'
          maxLength: 500
        message:
          oneOf:
            - $ref: '#/components/schemas/ActionMessage'
            - type: 'null'
        customFieldValue:
          type:
            - string
            - 'null'
          maxLength: 500
        bid:
          description: Bid only; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/BidStatus'
            - type: 'null'
        payments:
          type: array
          description: The Action's online payments, oldest first. More than one only after a retried
            payment or a raised bid. Empty for a free or cash Action.
          maxItems: 100
          items:
            $ref: '#/components/schemas/PaymentSummary'
        cashReceipt:
          description: Present when cash in person was chosen.
          oneOf:
            - $ref: '#/components/schemas/CashReceiptSummary'
            - type: 'null'
        fulfilmentDeadlineAt:
          description: When the Action expires if the creator has not fulfilled it. Set when the Action
            becomes `SUBMITTED`, for a free Action as for a paid one (decision 24); a free Action whose
            configuration has no deadline rule has none. When it passes, a free Action becomes `EXPIRED`
            with no payment effect and a paid one is refunded in full. Always `null` for a Vote and a
            Tip.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        canCancel:
          type: boolean
          description: Whether `cancelAction` would succeed now. `true` only before payment is confirmed.
        canRaise:
          type: boolean
          description: Whether `raiseBid` would succeed now. Always `false` unless this is a ranked
            Bid.
        closeReason:
          type:
            - string
            - 'null'
          description: Machine-readable reason for a terminal state, for example `FULFILMENT_DEADLINE_EXPIRED`,
            `CREATOR_REJECTED`, `CREATOR_ACTION_DISABLED`, `PARTICIPANT_CANCELLED`, `PAYMENT_NOT_CONFIRMED`.
            Open list.
          maxLength: 60
          pattern: ^[A-Z][A-Z0-9_]*$
        rejectionReason:
          type:
            - string
            - 'null'
          description: 'Added in 1.0.0-alpha.2. The free-text reason the creator gave when rejecting
            this Action (`rejectAction`), as written; `null` when the Action is not `REJECTED`, when
            no reason was given, or when it was rejected by moderation. Optional in alpha.2 so that a
            server built against alpha.1 still conforms; a client treats an absent field as `null`.
            It is to become required before 1.0.0. The machine-readable reason is `closeReason`.'
          maxLength: 255
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        submittedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        acceptedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        fulfilledAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        closedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ParticipantActionPage:
      type: object
      description: Pagination envelope carrying the caller's Actions.
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ParticipantAction'
        page:
          $ref: '#/components/schemas/PageInfo'
    SubmissionResult:
      type: object
      description: Result of submitting an Action. When `paymentRequired` is `true` the client continues
        with `createPayment` or `reportCashPayment`.
      required:
        - action
        - paymentRequired
        - paymentMethods
      properties:
        action:
          $ref: '#/components/schemas/ParticipantAction'
        paymentRequired:
          type: boolean
          description: '`true` when the Action needs a payment before it counts.'
        paymentMethods:
          type: array
          description: The methods the participant can use, decided by the server. Empty when no payment
            is required. The amount due is `action.amount`.
          maxItems: 20
          items:
            $ref: '#/components/schemas/PaymentMethodOption'
    BidPosition:
      type: object
      required:
        - actionId
        - rank
        - rankedBidCount
        - total
        - asOf
      properties:
        actionId:
          $ref: '#/components/schemas/Id'
        rank:
          type:
            - integer
            - 'null'
          format: int32
          description: Current rank; 1 is first. `null` while the bid is not ranked.
          minimum: 1
        rankedBidCount:
          type: integer
          format: int32
          minimum: 0
        total:
          $ref: '#/components/schemas/Money'
        asOf:
          $ref: '#/components/schemas/Timestamp'
    ActionPaymentMethods:
      type: object
      required:
        - actionId
        - amountDue
        - methods
      properties:
        actionId:
          $ref: '#/components/schemas/Id'
        amountDue:
          description: Computed by the server; `null` when nothing is due.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        methods:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PaymentMethodOption'
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - method
      properties:
        method:
          description: An `ONLINE` method code from `listActionPaymentMethods`. Never `CASH_IN_PERSON`.
          $ref: '#/components/schemas/PaymentMethodCode'
    CheckoutInstruction:
      type: object
      description: Provider-neutral instruction for continuing a payment.
      required:
        - type
        - url
      properties:
        type:
          type: string
          description: 'How the client continues. `REDIRECT`: open `url`. Further values may be added
            once a payment provider is chosen.'
          enum:
            - REDIRECT
        url:
          type: string
          description: Address of the provider's checkout page for this payment. Single-use; expires
            with the payment.
          format: uri
          maxLength: 2048
          pattern: ^https://
    Payment:
      type: object
      description: An online payment as the payer sees it. It carries no fee information and no provider
        reference.
      required:
        - id
        - actionId
        - purpose
        - amount
        - method
        - state
        - checkout
        - expiresAt
        - confirmedAt
        - failureCode
        - refund
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actionId:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          enum:
            - INITIAL
            - BID_RAISE
        amount:
          description: Computed by the server. For a raise, the increase only.
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        state:
          $ref: '#/components/schemas/PaymentState'
        checkout:
          description: Present while the state is `CREATED` or `PENDING`; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/CheckoutInstruction'
            - type: 'null'
        expiresAt:
          description: End of the checkout window.
          $ref: '#/components/schemas/Timestamp'
        confirmedAt:
          description: When the server verified the payment.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        failureCode:
          type:
            - string
            - 'null'
          description: Machine-readable reason for `FAILED`, safe to show. Open list. Never a provider's
            raw code.
          maxLength: 60
          pattern: ^[A-Z][A-Z0-9_]*$
        refund:
          oneOf:
            - $ref: '#/components/schemas/RefundSummary'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PaymentReceipt:
      type: object
      description: Receipt data for a confirmed payment.
      required:
        - paymentId
        - issuedAt
        - merchant
        - platformName
        - action
        - amount
        - method
        - paymentState
        - refund
      properties:
        paymentId:
          $ref: '#/components/schemas/Id'
        issuedAt:
          $ref: '#/components/schemas/Timestamp'
        merchant:
          type: object
          description: The creator the payment was made to.
          required:
            - creatorHandle
            - displayName
          properties:
            creatorHandle:
              $ref: '#/components/schemas/Handle'
            displayName:
              type: string
              maxLength: 80
        platformName:
          type: string
          description: The platform through which the payment was made.
          maxLength: 80
        action:
          type: object
          required:
            - id
            - type
            - title
          properties:
            id:
              $ref: '#/components/schemas/Id'
            type:
              $ref: '#/components/schemas/ActionType'
            title:
              type: string
              maxLength: 120
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/PaymentMethodCode'
        paymentState:
          $ref: '#/components/schemas/PaymentState'
        refund:
          oneOf:
            - $ref: '#/components/schemas/RefundSummary'
            - type: 'null'
    ReportCashPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - cashTermsAcknowledged
      properties:
        cashTermsAcknowledged:
          type: boolean
          const: true
          description: Must be `true`.
    CashReceipt:
      type: object
      description: The record of cash paid in person, directly to the creator. It is the creator's
        attestation. It is not a payment collected by the platform, not money held by the platform
        and not part of any balance.
      required:
        - id
        - actionId
        - actionType
        - creatorActionTitle
        - amount
        - state
        - platformFee
        - processingFee
        - reportedAt
        - confirmedAt
        - note
        - voidedAt
        - correctsCashReceiptId
        - correctionReason
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actionId:
          $ref: '#/components/schemas/Id'
        actionType:
          $ref: '#/components/schemas/ActionType'
        creatorActionTitle:
          type: string
          maxLength: 120
        amount:
          description: The amount of cash. On a correction, the amount the creator now attests was
            received, which may be zero.
          $ref: '#/components/schemas/Money'
        state:
          $ref: '#/components/schemas/CashReceiptState'
        platformFee:
          description: Always zero. A fixed product rule, not a setting.
          $ref: '#/components/schemas/Money'
        processingFee:
          description: 'Always zero: no payment provider processed the cash.'
          $ref: '#/components/schemas/Money'
        reportedAt:
          $ref: '#/components/schemas/Timestamp'
        confirmedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        note:
          type:
            - string
            - 'null'
          maxLength: 255
        voidedAt:
          description: Set when a pending receipt was declined or timed out. The state does not change.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        correctsCashReceiptId:
          description: On a correction, the receipt it corrects; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        correctionReason:
          type:
            - string
            - 'null'
          maxLength: 255
    CashReceiptPage:
      type: object
      description: Pagination envelope carrying cash receipts.
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CashReceipt'
        page:
          $ref: '#/components/schemas/PageInfo'
    ConfirmCashReceiptRequest:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          description: Must equal the amount on the receipt.
          $ref: '#/components/schemas/Money'
        note:
          type: string
          maxLength: 255
    VoidCashReceiptRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 255
    CorrectCashReceiptRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - reason
      properties:
        amount:
          description: The amount actually received. Zero or more.
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 1
          maxLength: 255
    IncomingParticipant:
      type: object
      description: Who made the Action, as far as the creator is shown. No identifier or contact detail
        of the participant is ever included.
      additionalProperties: false
      required:
        - kind
        - displayName
      properties:
        kind:
          type: string
          enum:
            - MEMBER
            - GUEST
        displayName:
          type:
            - string
            - 'null'
          description: The member's display name; `null` for a guest or a member with no display name.
          maxLength: 80
    RejectActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Optional reason. It is shown to the participant in `rejectionReason` on
            their Action and kept in the Action's state history. It must not contain anything the
            creator would not show the participant.
          maxLength: 255
    IncomingAction:
      type: object
      description: A participant Action as the creator who receives it sees it.
      required:
        - id
        - type
        - state
        - creatorActionId
        - creatorActionTitle
        - participant
        - selection
        - note
        - message
        - customFieldValue
        - amount
        - paymentMethodKind
        - paymentState
        - cashReceiptState
        - bid
        - fulfilmentDeadlineAt
        - createdAt
        - submittedAt
        - acceptedAt
        - fulfilledAt
        - closedAt
        - closeReason
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/ActionType'
        state:
          $ref: '#/components/schemas/ActionState'
        creatorActionId:
          $ref: '#/components/schemas/Id'
        creatorActionTitle:
          type: string
          maxLength: 120
        participant:
          $ref: '#/components/schemas/IncomingParticipant'
        selection:
          description: The choice made on a Request or Vote; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/ActionSelection'
            - type: 'null'
        note:
          type:
            - string
            - 'null'
          maxLength: 500
        message:
          oneOf:
            - $ref: '#/components/schemas/ActionMessage'
            - type: 'null'
        customFieldValue:
          type:
            - string
            - 'null'
          maxLength: 500
        amount:
          description: The amount of the Action; for a Bid, the bidder's confirmed total. `null` when
            free.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        paymentMethodKind:
          $ref: '#/components/schemas/ActionPaymentKind'
        paymentState:
          description: State of the Action's online payment (for a bid, of its first payment); `null`
            for a free or cash Action.
          oneOf:
            - $ref: '#/components/schemas/PaymentState'
            - type: 'null'
        cashReceiptState:
          description: State of the cash receipt; `null` unless cash in person was chosen.
          oneOf:
            - $ref: '#/components/schemas/CashReceiptState'
            - type: 'null'
        bid:
          description: Bid only; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/BidStatus'
            - type: 'null'
        fulfilmentDeadlineAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        submittedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        acceptedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        fulfilledAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        closedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        closeReason:
          type:
            - string
            - 'null'
          maxLength: 60
          pattern: ^[A-Z][A-Z0-9_]*$
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    IncomingActionPage:
      type: object
      description: Pagination envelope carrying incoming Actions.
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/IncomingAction'
        page:
          $ref: '#/components/schemas/PageInfo'
    CurrencyBalance:
      type: object
      description: Pending balance figures for one currency. See `getOwnPendingBalance` for the meaning
        of each. None is spendable or withdrawable.
      required:
        - currency
        - collected
        - notYetEligible
        - inCoolOff
        - held
        - eligible
        - processing
        - paidOut
        - owed
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        collected:
          $ref: '#/components/schemas/Money'
        notYetEligible:
          $ref: '#/components/schemas/Money'
        inCoolOff:
          description: The part of `notYetEligible` still in the cool-off. Added in 1.0.0-alpha.3.
          $ref: '#/components/schemas/Money'
        held:
          $ref: '#/components/schemas/Money'
        eligible:
          description: Payable now.
          $ref: '#/components/schemas/Money'
        processing:
          description: In transit to the payout destination.
          $ref: '#/components/schemas/Money'
        paidOut:
          $ref: '#/components/schemas/Money'
        owed:
          description: Zero or negative.
          $ref: '#/components/schemas/Money'
    CashTotals:
      type: object
      description: Cash in person for one currency. Never part of a balance.
      required:
        - currency
        - confirmed
        - pendingConfirmation
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        confirmed:
          description: Cash the creator has confirmed receiving, after corrections.
          $ref: '#/components/schemas/Money'
        pendingConfirmation:
          description: Cash reported by participants and not yet confirmed or voided.
          $ref: '#/components/schemas/Money'
    PendingBalance:
      type: object
      description: Read-only pending balance summary, derived from the ledger. There is no wallet.
      required:
        - asOf
        - payoutEligibilityState
        - balances
        - cash
      properties:
        asOf:
          description: When the figures were calculated.
          $ref: '#/components/schemas/Timestamp'
        payoutEligibilityState:
          $ref: '#/components/schemas/PayoutEligibilityState'
        balances:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CurrencyBalance'
        cash:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CashTotals'
    LedgerEntry:
      type: object
      description: A ledger-derived entry, as the creator sees it.
      required:
        - id
        - entryType
        - amount
        - occurredAt
        - actionId
        - paymentId
        - cashReceiptId
        - payoutId
        - reversesEntryId
        - cashMemo
      properties:
        id:
          $ref: '#/components/schemas/Id'
        entryType:
          $ref: '#/components/schemas/LedgerEntryType'
        amount:
          description: Signed. Positive adds to the creator's entitlement; negative reduces it.
          $ref: '#/components/schemas/Money'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        actionId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        paymentId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        cashReceiptId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        payoutId:
          description: On a payout entry (`CREATOR_PAYOUT`, `PAYOUT_FEE`), the payout. Added in 1.0.0-alpha.3.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        reversesEntryId:
          description: On a compensating entry, the entry it reverses.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        cashMemo:
          type: boolean
          description: '`true` for a cash entry: a record of the creator''s attestation, never counted
            in a balance.'
    LedgerEntryPage:
      type: object
      description: Pagination envelope carrying ledger entries.
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    PayoutStatus:
      type: string
      description: 'Progress of a payout. `PENDING` and `PROCESSING` are in transit; `PAID` is final;
        `FAILED` and `REVERSED` returned the amount to the creator''s entitlement. Added in
        1.0.0-alpha.3. Further values may be added; a client treats an unknown value as "in progress".'
      enum:
        - PENDING
        - PROCESSING
        - PAID
        - FAILED
        - REVERSED
    Payout:
      type: object
      description: A payout from the platform to the creator's payout destination (decision 26). Added
        in 1.0.0-alpha.3.
      required:
        - id
        - status
        - amount
        - fee
        - charged
        - destinationDisplay
        - failureCode
        - createdAt
        - paidAt
        - returnedAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/PayoutStatus'
        amount:
          description: What is sent to the destination.
          $ref: '#/components/schemas/Money'
        fee:
          description: The provider's payout fee borne by the creator; zero where the platform bears it.
          $ref: '#/components/schemas/Money'
        charged:
          description: What left the creator's entitlement, `amount` plus `fee`.
          $ref: '#/components/schemas/Money'
        destinationDisplay:
          type:
            - string
            - 'null'
          description: Masked description of the destination it was sent to. Never a full account number.
          maxLength: 120
        failureCode:
          type:
            - string
            - 'null'
          description: Why a `FAILED` or `REVERSED` payout did not complete. Further values may be added.
          pattern: ^[A-Z][A-Z0-9_]*$
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        paidAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        returnedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PayoutPage:
      type: object
      description: Pagination envelope carrying payouts.
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Payout'
        page:
          $ref: '#/components/schemas/PageInfo'
    SettlementBankAccount:
      type: object
      description: A payout bank account, masked. Added in 1.0.0-alpha.3.
      required:
        - bankName
        - accountNumberLast4
        - accountHolderName
      properties:
        bankName:
          type:
            - string
            - 'null'
          maxLength: 100
        accountNumberLast4:
          type: string
          description: The last four digits of the account number; never more.
          pattern: ^[0-9]{4}$
        accountHolderName:
          type:
            - string
            - 'null'
          maxLength: 100
    SettlementProfile:
      type: object
      description: A member's payout eligibility and masked payout destination.
      required:
        - payoutEligibilityState
        - country
        - currency
        - railType
        - destinationDisplay
        - bankAccount
        - verificationMethod
        - verifiedAt
        - suspendedAt
        - payoutHoldUntil
        - updatedAt
      properties:
        payoutEligibilityState:
          $ref: '#/components/schemas/PayoutEligibilityState'
        country:
          oneOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
        currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
        railType:
          description: Kind of payout destination. `MOBILE_MONEY` is reserved (decision 27) and not
            offered for South Africa. Further values may be added.
          type:
            - string
            - 'null'
          enum:
            - BANK_ACCOUNT
            - MOBILE_MONEY
            - null
        destinationDisplay:
          type:
            - string
            - 'null'
          description: Masked description of the destination, safe to show. Never a full account number.
          maxLength: 120
        bankAccount:
          description: The masked bank account, when the destination is one. Added in 1.0.0-alpha.3.
          oneOf:
            - $ref: '#/components/schemas/SettlementBankAccount'
            - type: 'null'
        verificationMethod:
          description: How the destination was verified. Added in 1.0.0-alpha.3.
          type:
            - string
            - 'null'
          enum:
            - PROVIDER_VALIDATION
            - MANUAL_REVIEW
            - null
        verifiedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        suspendedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        payoutHoldUntil:
          description: No payout before this instant, after a change of destination. Added in 1.0.0-alpha.3.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updatedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SubmitSettlementBankAccountRequest:
      type: object
      description: 'A South African bank account for payouts. `accountType`, `documentType` and
        `documentNumber` come together or not at all. The account number and document number are
        never stored or echoed. Added in 1.0.0-alpha.3.'
      additionalProperties: false
      required:
        - bankCode
        - accountNumber
        - accountHolderName
      properties:
        bankCode:
          type: string
          description: The bank's code as the payment provider lists it.
          pattern: ^[0-9A-Za-z]{2,20}$
        accountNumber:
          type: string
          pattern: ^[0-9]{6,20}$
        accountHolderName:
          type: string
          description: The account holder's name as registered with the bank.
          minLength: 2
          maxLength: 100
        accountType:
          type: string
          enum:
            - personal
            - business
        documentType:
          type: string
          description: '`identityNumber` or `passportNumber` for a personal account,
            `businessRegistrationNumber` for a business account.'
          enum:
            - identityNumber
            - passportNumber
            - businessRegistrationNumber
        documentNumber:
          type: string
          pattern: ^[0-9A-Za-z]{4,30}$
    ReportReason:
      type: string
      description: Why something is reported (domain model 10.1; a proposal of `api-symfony`).
      enum: [SPAM, HARASSMENT, HATE, SEXUAL_CONTENT, VIOLENCE, ILLEGAL, FRAUD, IMPERSONATION, OTHER]
    ReportRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, reason]
      properties:
        subjectType:
          type: string
          enum: [CREATOR_PROFILE, CREATOR_ACTION]
        subjectId:
          $ref: '#/components/schemas/Id'
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          minLength: 1
          maxLength: 1000
    FiledReport:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [REPORTED]
    GuestHistoryResult:
      type: object
      additionalProperties: false
      required: [linkedActions]
      properties:
        linkedActions:
          type: integer
          minimum: 0
    CreatorQrCode:
      type: object
      additionalProperties: false
      required: [state, code, url, canIssue]
      properties:
        state:
          type: string
          enum: [ACTIVE, SUSPENDED, NONE]
        code:
          type: [string, 'null']
          description: The short code printed under the image; null unless `ACTIVE`.
          minLength: 1
          maxLength: 16
        url:
          type: [string, 'null']
          format: uri
