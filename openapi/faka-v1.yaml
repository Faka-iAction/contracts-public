  /actions/{actionId}/cancel:
    post:
      operationId: cancelAction
      tags:
        - Participation
      summary: Withdraw an Action before payment is confirmed
      description: |
        Withdraws the caller's Action. **This is possible only before payment is confirmed**: while
        the Action is `CREATED` or `INITIATED` (`action.canCancel` is `true`). The Action moves to
        `CANCELLED`, any open online payment is expired and any pending cash report is voided.

        Once a payment is confirmed, or the creator has confirmed cash, the participant cannot cancel
        and cannot obtain a refund by cancelling: the response is `409` with `ACTION_NOT_CANCELLABLE`.
        A Vote can never be cancelled. Refunds are automatic and are never requested through this API.

        If the open online payment's outcome is not yet known, the server cannot safely expire it and
        the response is `409` with `PAYMENT_ALREADY_IN_PROGRESS`; the client reads the payment status
        and tries again.

        Repeating the call on an Action the caller already cancelled returns `200` and changes nothing.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The cancelled Action.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantAction'
              examples:
                cancelled:
                  value:
                    id: 01JAB3A5B7C9D1E3F5G7H9J1K3
                    type: REQUEST
                    state: CANCELLED
                    creatorAction:
                      id: 01JAB2C4D6E8F0G2H4J6K8M0N2
                      type: REQUEST
                      slug: request
                      title: Request a song
                      creatorHandle: djthandi
                      creatorDisplayName: DJ Thandi
                    configVersion: 1
                    paymentRequirement: PAID
                    amount:
                      amountMinor: 2000
                      currency: ZAR
                    paymentMethod: null
                    selection:
                      optionId: 01JAB6E8F0G2H4J6K8M0N2P4Q6
                      label: Water
                      secondaryLabel: Tyla
                    note: null
                    message: null
                    customFieldValue: null
                    bid: null
                    payments: []
                    cashReceipt: null
                    fulfilmentDeadlineAt: null
                    canCancel: false
                    canRaise: false
                    closeReason: PARTICIPANT_CANCELLED
                    createdAt: '2026-10-12T20:00:00Z'
                    submittedAt: null
                    acceptedAt: null
                    fulfilledAt: null
                    closedAt: '2026-10-12T20:02:00Z'
                    updatedAt: '2026-10-12T20:02:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
