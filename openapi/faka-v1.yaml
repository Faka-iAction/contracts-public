  /me/balance:
    get:
      operationId: getOwnPendingBalance
      tags:
        - Creator Money
      summary: Get the caller's pending balance summary (read-only)
      description: |
        Returns a read-only summary of what has been collected for the creator through online
        payments and where it stands on the way to payout. Every figure is derived from the ledger
        and the payout records when the request is made. Nothing here is stored as a balance.

        **There is no wallet.** No amount in this response can be spent, transferred, topped up or
        withdrawn, and this API has no withdraw operation. The
        platform pays the money out to the creator's verified payout destination (`listOwnPayouts`). A
        client must not describe any figure as "available" or "withdrawable"; only `eligible`, with
        `payoutEligibilityState` `PAYOUT_ENABLED`, is waiting to be paid out.

        Per currency, as creator entitlement (after the processing fee and the platform fee):

        - `notYetEligible`: recorded but not yet payable: the payment is still in the cool-off, or
          its Action is not fulfilled (a Tip counts as fulfilled once paid; a Bid at any rank must
          be fulfilled), or the creator has no `PAYOUT_ENABLED` Settlement Profile.
        - `inCoolOff`: the part of `notYetEligible` whose payment is still in the mandatory
          cool-off. Added in 1.0.0-alpha.3; not one of the five figures below.
        - `held`: blocked by a dispute, by a refund that is requested or under way, or by the payout
          hold that follows a change of payout destination.
        - `eligible`: payable: the cool-off has elapsed, the Action is fulfilled, nothing is open
          against it and the Settlement Profile is `PAYOUT_ENABLED` with no hold. It is paid out at
          the next payout run if it reaches the platform's minimum payout amount.
        - `processing`: in transit: a payout has been recorded and the provider has not yet
          confirmed or returned it.
        - `paidOut`: the provider confirmed the payout. Where the creator bears the provider's payout
          fee, the fee is included.
        - `owed`: zero or negative. A refund or chargeback after a payout that later collections
          have not yet covered; it is recovered from them before anything more is paid out.
        - `collected`: the sum of `notYetEligible`, `held`, `eligible`, `processing` and `paidOut`.

        **Cash is reported separately and is never part of any balance or payout.** `cash` shows
        cash the creator has confirmed receiving in person and cash reported but not yet confirmed.
        It is the creator's own money, received directly; the platform never held it and never pays
        it out.

        A creator can have a pending balance without a Settlement Profile. Nothing is paid out until
        the profile is `PAYOUT_ENABLED`, however long ago the cool-off ended.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The pending balance summary.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingBalance'
              examples:
                noPayoutDestinationYet:
                  value:
                    asOf: '2026-10-13T08:00:00Z'
                    payoutEligibilityState: DESTINATION_PENDING
                    balances:
                      - currency: ZAR
                        collected:
                          amountMinor: 87000
                          currency: ZAR
                        notYetEligible:
                          amountMinor: 52000
                          currency: ZAR
                        inCoolOff:
                          amountMinor: 20000
                          currency: ZAR
                        held:
                          amountMinor: 0
                          currency: ZAR
                        eligible:
                          amountMinor: 0
                          currency: ZAR
                        processing:
                          amountMinor: 0
                          currency: ZAR
                        paidOut:
                          amountMinor: 35000
                          currency: ZAR
                        owed:
                          amountMinor: 0
                          currency: ZAR
                    cash:
                      - currency: ZAR
                        confirmed:
                          amountMinor: 14000
                          currency: ZAR
                        pendingConfirmation:
                          amountMinor: 2000
                          currency: ZAR
                payoutInTransit:
                  summary: Payouts enabled, one payout in transit
                  value:
                    asOf: '2026-10-20T08:00:00Z'
                    payoutEligibilityState: PAYOUT_ENABLED
                    balances:
                      - currency: ZAR
                        collected:
                          amountMinor: 5820
                          currency: ZAR
                        notYetEligible:
                          amountMinor: 1940
                          currency: ZAR
                        inCoolOff:
                          amountMinor: 1940
                          currency: ZAR
                        held:
                          amountMinor: 0
                          currency: ZAR
                        eligible:
