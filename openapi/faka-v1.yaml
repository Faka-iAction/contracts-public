                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: The bid cannot be raised now (`BID_NOT_RAISABLE`), another payment for it
            is still open (`PAYMENT_ALREADY_IN_PROGRESS`), the method is not available (`PAYMENT_METHOD_NOT_AVAILABLE`),
            or the idempotency key was misused.
          headers:
