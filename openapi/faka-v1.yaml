                cashReceiptStateConflict:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: CASH_RECEIPT_STATE_CONFLICT
                    detail: You chose to pay cash for this. Cancel and start again to pay online.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                paymentMethodNotAvailable:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: PAYMENT_METHOD_NOT_AVAILABLE
                    detail: This payment method is not available.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                    errors:
