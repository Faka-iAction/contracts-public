  /me/payouts:
    get:
      operationId: listOwnPayouts
      tags:
        - Creator Money
      summary: List the caller's payouts (read-only)
      description: |
        Added in 1.0.0-alpha.3 (product decision 26). Returns a page of the payouts the platform has
        made, or is making, to the caller's payout destination, most recent first.

        Payouts are made by the platform, in payout runs: there is no operation to request, cancel or
        speed up a payout. A payout pays the whole `eligible` amount of a currency once it reaches the
        platform's minimum payout amount (configuration, not part of this contract).

        `amount` is what is sent to the destination; `fee` is the provider's payout fee the creator
        bears (zero where the platform bears it); `charged` is what left the creator's entitlement
        (`amount` plus `fee`). `PENDING` and `PROCESSING` are in transit. A `FAILED` or `REVERSED`
        payout returned its `charged` amount to the creator's entitlement, to be paid in a later run;
        `failureCode` says why (`PROVIDER_REJECTED`, `PROVIDER_FAILED`, `PROVIDER_REVERSED`,
        `DESTINATION_CHANGED`; further values may be added). The destination is shown masked only.
        Needs the creator capability.
      parameters:
        - name: status
          in: query
          description: Only payouts in this status.
          schema:
            $ref: '#/components/schemas/PayoutStatus'
          example: PAID
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: A page of payouts.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutPage'
              examples:
                onePage:
                  value:
                    items:
                      - id: 01JABPO1Q3R5S7T9V1W3X5Y7Z9
                        status: PAID
                        amount:
                          amountMinor: 1840
                          currency: ZAR
                        fee:
                          amountMinor: 100
                          currency: ZAR
                        charged:
                          amountMinor: 1940
                          currency: ZAR
                        destinationDisplay: Test Bank account ending 3210
                        failureCode: null
                        createdAt: '2026-10-20T06:00:00Z'
                        paidAt: '2026-10-20T06:03:00Z'
                        returnedAt: null
                        updatedAt: '2026-10-20T06:03:00Z'
                    page:
                      limit: 20
                      hasMore: false
                      nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/settlement-profile:
    get:
      operationId: getOwnSettlementProfile
      tags:
        - Settlement Profile
      summary: Get the caller's payout eligibility and masked payout destination
      description: |
        Returns the caller's Settlement Profile: whether the platform can pay out to them, and a
        masked description of the payout destination. A member who has not given payout details has
        no profile yet; the response is still `200`, with `payoutEligibilityState`
        `DESTINATION_PENDING` and the other fields `null`.

        States: `DESTINATION_PENDING` (no payout destination given yet, or the last one was not
        accepted on review), `VERIFICATION_PENDING` (a destination has been given and is waiting for
        verification), `PAYOUT_ENABLED` (verified; payouts are made), `PAYOUT_SUSPENDED` (blocked
        after having been set up). `NO_ELIGIBLE_PAYEE` and `NOT_APPLICABLE` are part of the canonical
        set and are reserved for a later phase; a client must handle them as "payout is not
        possible".

        `payoutHoldUntil`: after a change of payout destination, no payout is made before this
        instant, even when `PAYOUT_ENABLED`. `verificationMethod`: `PROVIDER_VALIDATION` (the payment
        provider verified the account against the owner's identity or registration number) or
        `MANUAL_REVIEW` (an operator verified it).

        **A Settlement Profile is not needed to create a creator profile, to publish paid Creator
        Actions, to receive payments or to accept cash.** It is needed only to be paid out. Until it
        is `PAYOUT_ENABLED` the creator's collected funds stay in the platform's provider account
        and show as a pending balance.

        The response never contains a full account number, a bank code, an identity document or a
        provider reference: only the bank's name, the last four digits of the account number and the
        account holder's name.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The Settlement Profile, or the default state when none exists.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementProfile'
              examples:
                notStarted:
                  summary: No payout details yet
                  value:
                    payoutEligibilityState: DESTINATION_PENDING
                    country: null
                    currency: null
                    railType: null
                    destinationDisplay: null
                    bankAccount: null
                    verificationMethod: null
                    verifiedAt: null
                    suspendedAt: null
                    payoutHoldUntil: null
                    updatedAt: null
                waitingForReview:
                  summary: Bank account given, waiting for verification
                  value:
                    payoutEligibilityState: VERIFICATION_PENDING
                    country: ZA
                    currency: ZAR
                    railType: BANK_ACCOUNT
                    destinationDisplay: Test Bank account ending 3210
                    bankAccount:
                      bankName: Test Bank
                      accountNumberLast4: '3210'
                      accountHolderName: Thandi Mokoena
                    verificationMethod: null
                    verifiedAt: null
                    suspendedAt: null
                    payoutHoldUntil: null
                    updatedAt: '2026-10-13T09:00:00Z'
                enabledOnHold:
                  summary: Verified, on hold after a change of destination
                  value:
                    payoutEligibilityState: PAYOUT_ENABLED
                    country: ZA
                    currency: ZAR
                    railType: BANK_ACCOUNT
                    destinationDisplay: Test Bank account ending 3334
                    bankAccount:
                      bankName: Test Bank
                      accountNumberLast4: '3334'
                      accountHolderName: Thandi Mokoena
                    verificationMethod: PROVIDER_VALIDATION
                    verifiedAt: '2026-10-13T09:01:00Z'
                    suspendedAt: null
                    payoutHoldUntil: '2026-10-16T09:01:00Z'
                    updatedAt: '2026-10-13T09:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/settlement-profile/bank-account:
    put:
      operationId: submitSettlementBankAccount
      tags:
        - Settlement Profile
      summary: Give or replace the caller's payout bank account
      description: |
        Added in 1.0.0-alpha.3; replaces `startSettlementOnboarding` and its provider-hosted step
        (product decision 26: the platform collects payout details itself). Sets the caller's payout
        destination to a South African bank account. Mobile money and e-wallets are not offered: the
        payment provider does not support them for South Africa (decision 27).

        The server registers the account with the payment provider as a transfer recipient and keeps
        only the provider's recipient reference, the bank's name, the last four digits of the
        account number and the account holder's name. **The full account number, the bank code and
        the document number are never stored, logged, returned, put in an event or audited.**

        Verification: when `accountType`, `documentType` and `documentNumber` are given (all three
        or none) and the server is configured to use it, the provider verifies the account against
        the owner's identity or registration number at once: the profile becomes `PAYOUT_ENABLED`,
        or the request is refused with `422 SETTLEMENT_DETAILS_NOT_VERIFIED` and nothing is kept.
        Otherwise the profile is `VERIFICATION_PENDING` until an operator has reviewed it. The
        provider's account-name lookup is not available for South Africa.

        **Recent sign-in required:** the sign-in that issued the access token's family must be
        recent (server configuration; refreshing a token does not count). Otherwise the answer is
        `403 RECENT_SIGN_IN_REQUIRED`, and the client signs the member in again and repeats the call.

        **Payout hold:** replacing an earlier destination stops payouts until `payoutHoldUntil`
        (server configuration), and a payout recorded for the old destination but not yet sent goes
        back to the pending balance. Submitting the same details again changes nothing.

        `Idempotency-Key` is required. A replay with the same key and the same request returns the
        stored response without contacting the provider again.

        Where payouts are not offered for the member's country, or the profile is suspended, the
        answer is `409 SETTLEMENT_ONBOARDING_NOT_AVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSettlementBankAccountRequest'
            examples:
              forReview:
                summary: Bank account only; an operator reviews it
                value:
                  bankCode: '632005'
                  accountNumber: '0009876543210'
                  accountHolderName: Thandi Mokoena
              withDocument:
                summary: With the owner's document, for verification by the provider
                value:
                  bankCode: '632005'
                  accountNumber: '0009876543210'
                  accountHolderName: Thandi Mokoena
                  accountType: personal
                  documentType: identityNumber
                  documentNumber: '0000000000000'
      responses:
        '200':
          description: The Settlement Profile after the change. Replaying the request with the same
            `Idempotency-Key` returns this same response.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementProfile'
              examples:
                waitingForReview:
                  value:
                    payoutEligibilityState: VERIFICATION_PENDING
                    country: ZA
                    currency: ZAR
                    railType: BANK_ACCOUNT
                    destinationDisplay: Test Bank account ending 3210
                    bankAccount:
                      bankName: Test Bank
                      accountNumberLast4: '3210'
                      accountHolderName: Thandi Mokoena
                    verificationMethod: null
                    verifiedAt: null
                    suspendedAt: null
                    payoutHoldUntil: null
                    updatedAt: '2026-10-13T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequestOrMissingIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The sign-in is not recent enough to change payout details (`RECENT_SIGN_IN_REQUIRED`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                recentSignInRequired:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: RECENT_SIGN_IN_REQUIRED
                    detail: Sign in again to change your payout details.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '409':
          description: Payout setup is not available for this member now (`SETTLEMENT_ONBOARDING_NOT_AVAILABLE`),
            another change to the profile won (`CONFLICT`), or the idempotency key was misused.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                settlementOnboardingNotAvailable:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: SETTLEMENT_ONBOARDING_NOT_AVAILABLE
                    detail: Payout setup is not available for your account right now.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                conflict:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: CONFLICT
                    detail: The request conflicts with the current state of the resource.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                idempotencyKeyReused:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: This idempotency key was already used with a different request.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '422':
          description: A field is invalid (`VALIDATION_FAILED`; the value is never echoed), the provider
            did not accept the details (`SETTLEMENT_DETAILS_REJECTED`), or the provider could not
            verify the account against the document given (`SETTLEMENT_DETAILS_NOT_VERIFIED`). Nothing
            was kept.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  value:
                    type: about:blank
                    title: Validation failed
                    status: 422
                    code: VALIDATION_FAILED
                    detail: One or more fields are invalid.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                    errors:
                      - field: accountNumber
                        code: INVALID_FORMAT
                detailsRejected:
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    code: SETTLEMENT_DETAILS_REJECTED
                    detail: These bank details were not accepted. Check them and try again.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
                detailsNotVerified:
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    code: SETTLEMENT_DETAILS_NOT_VERIFIED
                    detail: This bank account could not be verified against the details given.
                    correlationId: 01JA8Q2M5T7W9X3B6C4D8E0F1G
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PaymentProviderUnavailable'

  /reports:
    post:
      operationId: fileReport
      tags: [Trust and Safety]
      summary: Report a creator or a Creator Action
      description: |
        Files a report about a public creator profile or a public Creator Action (architecture 28;
        CONVENTIONS item 87). The caller is a signed-in member (bearer token) or a guest
        (`X-Guest-Token`); no contact detail is asked for. The report joins the moderation queue.

        `reason` is one of the codes of `ReportReason`. `details` is optional and is screened like a
        Shout-out message: text that fails screening is refused with `422` and field code
        `NOT_ALLOWED`, and nothing is stored. A subject that is not public, or does not exist, is
        `404` `NOT_FOUND`: the answer does not say which.
      security:
        - bearerAuth: []
        - guestToken: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            examples:
              aboutACreatorAction:
                value:
                  subjectType: CREATOR_ACTION
                  subjectId: 01JA8R1C5E7G9J2L4N6Q8S0U3W
                  reason: SPAM
                  details: The same message again and again.
      responses:
        '201':
          description: The report was filed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiledReport'
              examples:
                filed:
                  value:
                    id: 01JA8RB3D5F7H9K2M4P6R8T0V1
                    state: REPORTED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/guest-history:
    post:
      operationId: convertGuestHistory
      tags: [My Activity]
      summary: Add a guest session's Actions to the signed-in member
      description: |
        Links every Action of a guest session to the signed-in member (architecture 5.2; CONVENTIONS
        item 90). The member proves the session is theirs by sending its token in `X-Guest-Token`
        alongside the bearer token. Afterwards the guest token is no longer accepted.

        Converting a session that is already converted, or that has no Actions, changes nothing and
        returns `linkedActions: 0`. An unknown or expired guest token is `401` with
        `GUEST_TOKEN_INVALID`.
      parameters:
        - name: X-Guest-Token
          in: header
          required: true
          description: The token of the guest session to add.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: How many Actions were linked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestHistoryResult'
              examples:
                linked:
                  value:
                    linkedActions: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedParticipant'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/creator-profile/image:
    put:
      operationId: putOwnCreatorImage
      tags: [Creator Profile]
      summary: Set the signed-in creator's profile image
      description: |
        The request body is the image itself, as `image/jpeg`, `image/png` or
        `image/webp`, at most 5 MB. The server checks that it is an image of
        that kind and redraws it as a JPEG of at most 1024 pixels a side, so
        nothing of the original file (metadata, embedded content) is kept.
        The image replaces any earlier one, which is deleted.

        `imageUrl` in the response is where the image is served. The URL
        changes every time the image changes, so clients may cache it for
        as long as they like.

        Another content type is `422` with field code `INVALID_TYPE` on
        `body`; a body that is not a readable image of the stated kind, or
        is too large, is `422` with field code `INVALID_FORMAT`. `503` means
        file storage is unavailable; the old image is kept. `404` with
        `CREATOR_PROFILE_NOT_FOUND` when the caller is not a creator.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The creator profile with its new `imageUrl`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProfile'
              examples:
                profile:
                  $ref: '#/components/examples/CreatorProfileExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteOwnCreatorImage
      tags: [Creator Profile]
      summary: Remove the signed-in creator's profile image
      description: >-
        Removes the image and deletes the stored file; `imageUrl` becomes
        `null`. Removing when there is no image also answers `204`. `404`
        with `CREATOR_PROFILE_NOT_FOUND` when the caller is not a creator.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: The image is removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

