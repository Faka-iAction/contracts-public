  /me/creator-actions:
    post:
      operationId: createCreatorAction
      tags:
        - Creator Actions
      summary: Create a Creator Action (draft)
      description: |
        Creates a Creator Action on the caller's creator profile, in state `DRAFT`. A draft is not
        visible to the public. `type` is one of the five MVP1 types and never changes afterwards.

        `config` may be incomplete in a draft; `publishCreatorAction` checks that it is complete. Fields
        that do not apply to the `type` are rejected with field code `NOT_ALLOWED` (for example
        `minimumBid` on a Request). A Vote is always free in MVP1, and a Bid can never enable cash:
        both are rejected with `NOT_ALLOWED`. Amounts and limits are also checked against platform
        policy; a value outside policy is rejected with `OUT_OF_RANGE`. The policy values are not
        part of this contract.

        `slug` is the last segment of the public page `/@handle/slug` and is unique within the
        creator's profile. `Idempotency-Key` is optional: the slug gives natural uniqueness.

        A Creator Action can be created only while the creator profile's country is active. When it
        is not, the response is `409` with the general code `CONFLICT`; no more specific code exists
        yet (`CONVENTIONS.md`, Section 15, item 88). A Creator Action made before its country became
        inactive can still be changed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreatorActionRequest'
            examples:
              paidRequest:
                summary: A paid song request limited to a playlist
                value:
                  type: REQUEST
                  slug: request
                  title: Request a song
                  description: Pick a track from tonight's set.
                  config:
                    paymentRequirement: PAID
                    price:
                      amountMinor: 2000
                      currency: ZAR
                    cashInPersonEnabled: true
                    approvalRequired: true
                    fulfilmentDeadlineRule: FIXED_PERIOD_AFTER_PAYMENT
                    fulfilmentPeriodSeconds: 7200
                    duplicateSelectionsAllowed: false
                    optionsSource: PLAYLIST
                    playlistId: 01JAB7L9M1N3P5Q7R9S1T3V5W7
              bid:
                summary: A bid for priority
                value:
                  type: BID
                  slug: jump-the-queue
                  title: Jump the queue
                  config:
                    paymentRequirement: PAID
                    minimumBid:
                      amountMinor: 2000
                      currency: ZAR
                    bidIncrement:
                      amountMinor: 1000
                      currency: ZAR
                    fulfilmentDeadlineRule: FIXED_PERIOD_AFTER_PAYMENT
                    fulfilmentPeriodSeconds: 7200
              tip:
                summary: A tip
                value:
                  type: TIP
                  slug: tip
                  title: Say thanks
                  config:
